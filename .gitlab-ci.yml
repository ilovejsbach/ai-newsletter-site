# 사내 깃랩 Pages 배포 설정 — 2026-08 실제 검증본 (파이프라인 #846 성공).
# 사내 러너는 외부 docker.io 이미지를 못 받으므로 image 지정 없이 기본 환경을
# 쓰고, 이 인스턴스에서 동작이 확인된 `pages: true` 문법을 사용한다.
# 주차 폴더는 20*-*-* 글롭으로 잡히므로 매주 폴더가 늘어도 수정 불필요.
create-pages:
  stage: deploy
  script:
    - rm -rf public && mkdir public
    - cp index.html public/
    - cp -r fonts latest public/
    - cp -r 20*-*-* public/
  pages: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
