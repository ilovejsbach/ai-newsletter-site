<!doctype html>
<html lang="ko"><head><meta charset="utf-8">

<title>매직 쿼드런트 인터랙티브 (JS판)</title>
<style>
:root { color-scheme: light; --ink: #191f28; --muted: #6b7684; --line: #e5e8eb;
  --paper: #ffffff; --wash: #f4f5f7; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--wash); color: var(--ink);
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Noto Sans KR", sans-serif;
  line-height: 1.65; padding-block: 32px; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px; }
header.page-head { margin-bottom: 24px; }
h1 { margin: 0 0 8px; font-size: 26px; }
.note { margin: 0; color: var(--muted); font-size: 14px; }
.chart-card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
  padding: 24px; margin: 0 auto 20px; max-width: 760px; }
svg.mq-svg { width: 100%; height: auto; display: block; }
.mq-svg .gterm { cursor: help; }
.gterm { position: relative; border-bottom: 1px dashed rgb(45, 105, 193); cursor: help;
  outline-offset: 2px; }
.gterm-note { position: absolute; left: 0; top: calc(100% + 6px); z-index: 20; width: max-content;
  max-width: min(320px, 78vw); padding: 10px 13px; border: 1px solid #c0ddfc; border-radius: 4px;
  background: #fff; box-shadow: 0 6px 20px rgba(12, 39, 101, .16);
  font-size: 13px; line-height: 1.6; font-weight: 400; color: rgb(51, 52, 63);
  opacity: 0; visibility: hidden; transition: opacity .12s ease; }
.gterm:hover .gterm-note, .gterm:focus .gterm-note, .gterm:focus-within .gterm-note {
  opacity: 1; visibility: visible; }
.mq-svg .mq-outline { fill: none; stroke: #191f28; stroke-width: 2; }
.mq-svg .mq-divider { stroke: #c7ccd4; stroke-width: 1.5; }
.mq-svg .mq-qlabel { font-weight: 700; letter-spacing: .03em; }
.mq-svg .mq-axis { font-size: 13px; fill: var(--muted); font-weight: 600; }
.mq-svg .mq-cap { font-size: 11px; fill: var(--muted); }
.mq-svg .pt { stroke: var(--paper); stroke-width: 1.5; cursor: pointer; }
.mq-svg .pt:hover { stroke: var(--ink); stroke-width: 2; }
.mq-svg .pt-num { fill: #fff; font-weight: 700; pointer-events: none; }
.q-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 14px 0 0;
  padding: 0; list-style: none; font-size: 12.5px; color: var(--muted); }
.q-legend li { display: flex; align-items: center; gap: 6px; }
.q-legend .chip { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.tech-num { flex: none; width: 23px; height: 23px; border-radius: 50%; color: #fff;
  font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.badge { display: inline-block; margin-left: 8px; padding: 2px 9px; border-radius: 999px;
  font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--wash); color: var(--muted); }
.content-area { position: relative; }
.content-area:has(.peek-item:target) .idx-list { display: none; }
.idx-list { display: grid; grid-template-columns: 1fr; gap: 2px; }
@media (min-width: 640px) {
  .idx-list { grid-template-columns: 1fr 1fr; gap: 2px 14px; }
}
.idx-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px;
  text-decoration: none; color: var(--ink); }
.idx-row:hover { background: var(--wash); }
.idx-title { flex: 1 1 auto; font-weight: 600; font-size: 14px; }
.peek-item { display: none; background: var(--paper); border: 1px solid var(--line);
  border-radius: 12px; padding: 22px 24px; position: relative; }
.peek-item:target { display: block; }
.peek-close { display: inline-block; margin-bottom: 14px; font-size: 13px; font-weight: 700;
  color: #0f766e; text-decoration: none; }
.peek-close:hover { text-decoration: underline; }
.peek-eyebrow { margin: 0 0 4px; font-size: 12px; font-weight: 700; letter-spacing: .02em; }
.peek-title { margin: 0 0 10px; font-size: 21px; display: flex; align-items: center;
  gap: 10px; flex-wrap: wrap; }
.peek-body { font-size: 15.5px; line-height: 1.75; color: var(--ink); }

.wrap { max-width: 1320px; position: relative; }
.mq-svg .pt-group.is-active { transform-box: fill-box; transform-origin: center; transform: scale(1.4); }
.mq-svg .pt-group.is-active .pt { stroke: #fff; stroke-width: 1.8; }
#panel { position: fixed; right: 24px; bottom: 24px; width: min(420px, calc(100vw - 32px));
  height: min(72vh, 560px); min-width: 280px; min-height: 180px; max-width: 92vw;
  max-height: 90vh; overflow: auto; resize: both; background: rgba(255, 255, 255, .85);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: 14px; padding: 20px;
  box-shadow: 0 12px 32px rgba(25, 31, 40, .18); z-index: 20;
  transform: translateY(12px); opacity: 0; pointer-events: none;
  transition: transform .18s ease, opacity .18s ease;
  font-size: calc(14px * var(--panel-scale, 1)); }
#panel.is-open { transform: translateY(0); opacity: 1; pointer-events: auto; }
#panel.is-dragging { transition: none; }
#panel h3 { margin: 0 0 10px; padding-right: 26px; font-size: 1.3em; display: flex;
  align-items: center; gap: 8px; }
#panel .peek-body { font-size: 1em; }
#panel-drag { margin: -20px -20px 10px; padding: 8px 0; text-align: center;
  font-size: 11px; letter-spacing: .08em; color: var(--muted); cursor: grab;
  border-bottom: 1px dashed var(--line); user-select: none; }
#panel-drag:active { cursor: grabbing; }
#panel-close { position: absolute; top: 14px; right: 14px; width: 26px; height: 26px;
  border: none; border-radius: 999px; background: var(--wash); color: var(--muted);
  font-size: 15px; line-height: 1; cursor: pointer; }
#panel-close:hover { background: var(--line); }
#panel-resize-hint { position: absolute; bottom: 3px; right: 5px; font-size: 10px;
  color: var(--muted); opacity: .55; pointer-events: none; }
@media (max-width: 700px) {
  #panel { left: 0; right: 0; bottom: 0; width: auto; max-height: 60vh;
    border-radius: 16px 16px 0 0; resize: none; }
  #panel-drag { display: none; }
  #panel-resize-hint { display: none; }
}
</style></head>

<script>
const DATA = [{"order": 1, "name": "Huawei", "quadrant_color": "#56606f", "quadrant_ko": "니치 플레이어", "overview_html": "화웨이의 제품은 매니지드 서비스로 제공되는 Huawei Cloud Astro Zero로, Astro Pro·Astro Canvas와 함께 묶여 있다. 비주얼 설계 스튜디오와 런타임 엔진을 드래그 앤 드롭 모델링, 스크립트 엔진, 온라인 IDE, 별도의 샌드박스·배포 환경과 결합했다. AIGC 기반 코딩, 자연어-쿼리 변환 기능, AI 어시스턴트 위젯도 포함한다. 화웨이에 가장 알맞은 활용 사례는 AI 기반 애플리케이션 현대화다. 객체, 표준·반응형 고급 페이지, 스크립트 엔진이 시민 개발자와 전문 개발자 모두를 지원하며, 3,000개가 넘는 API와 500개가 넘는 컴포넌트, KooGallery 마켓플레이스로 이루어진 생태계가 Huawei Cloud 안에서 데이터 중심 애플리케이션의 폭넓은 확장을 가능하게 한다. 화웨이의 가장 강한 역량은 애플리케이션·데이터 연결성, <span class=\"gterm\" tabindex=\"0\">데브옵스<span class=\"gterm-note\">개발과 운영을 한 흐름으로 묶어 배포를 빠르고 안전하게 반복하는 방법론(DevOps)</span></span>, 플랫폼 지원이다. 연결성 면에서는 커넥터와 Kafka·ROMA Connect를 통한 데이터 접근, 여러 클라우드 서비스에 걸친 통합이 기업 데이터 시나리오를 뒷받침한다. 데브옵스 면에서는 그래픽 기반 플로우와 BPM이 실행 가능한 프로세스와 장기 실행 워크플로 모델링을 제공한다. 플랫폼 지원 면에서는 역할 기반 접근 제어, 메타데이터 <span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span>, 환경 격리, Huawei Cloud 인프라 위의 다중 리전 배포가 탄탄한 거버넌스와 복원력을 제공한다. 화웨이가 가장 크게 개선해야 할 지점은 <span class=\"gterm\" tabindex=\"0\">에이전틱 워크플로<span class=\"gterm-note\">AI 에이전트가 여러 단계를 스스로 판단해 실행하는 업무 처리 흐름</span></span>, 에이전트 구축·배포, 테스트다. 에이전트 개발이 별도 플랫폼에 머물러 있어 네이티브 에이전트 오케스트레이션이 제한적이고, 프롬프트 기반 저작·AI 전용 보안·네이티브 테스트 자동화 프레임워크도 제한적이라 외부 도구가 필요하다. 화웨이는 이 문서의 초안 검토나 추가 정보 요청에 응하지 않았다. 따라서 가트너의 분석은 다른 신뢰할 만한 출처를 근거로 했다."}, {"order": 2, "name": "Zoho", "quadrant_color": "#56606f", "quadrant_ko": "니치 플레이어", "overview_html": "조호의 제품은 Zoho Creator로, 하이브리드·<span class=\"gterm\" tabindex=\"0\">온프레미스<span class=\"gterm-note\">클라우드가 아니라 조직이 직접 소유한 서버에 설치해 운영하는 방식</span></span> 옵션을 갖춘 <span class=\"gterm\" tabindex=\"0\">멀티테넌트<span class=\"gterm-note\">여러 고객이 같은 시스템 인프라를 나눠 쓰되 데이터는 서로 분리되는 구조</span></span> 클라우드 서비스로 제공된다. AI 기반 개발을 돕는 Zia AI 에이전트, 맞춤 AI 에이전트 개발용 Zia Agent Studio, AI 기반 테스트용 Zoho QEngine을 포함한다. 별도 구매가 필요한 Zoho Sprints는 업무 관리에 쓰이고, Zoho <span class=\"gterm\" tabindex=\"0\">MCP<span class=\"gterm-note\">AI 에이전트가 외부 도구·데이터에 표준화된 방식으로 접근하게 하는 연결 규격(Model Context Protocol)</span></span>는 서드파티 AI 코딩 에이전트에 도구 접근을 열어 준다. 조호에 가장 알맞은 활용 사례는 맞춤형 애플리케이션 개발로, 맞춤형 <span class=\"gterm\" tabindex=\"0\">로우코드<span class=\"gterm-note\">코드를 적게 짜고 화면에서 끌어다 놓는 방식으로 애플리케이션을 만드는 개발 방식</span></span> 솔루션에서의 강점을 보여 준다. 플랜 에이전트는 사람이 승인한 통합을 반영해 편집 가능한 요구사항 문서를 생성하며, 이를 빌드 에이전트가 애플리케이션 생성에 활용한다. 플랫폼에서 만든 애플리케이션에 AI 챗봇으로 심을 수 있는 구성 가능한 챗 에이전트도 제공한다. 조호의 가장 강한 역량은 사용자 경험 설계, 애플리케이션·데이터 연결성, 플랫폼 지원이다. 내장 모바일 기기 관리와 함께 네이티브 iOS·안드로이드 앱 개발을 지원하고, Zoho Flow를 통해 1,000개가 넘는 사전 구축 커넥터에 접근할 수 있으며, 9개 데이터센터에 걸친 다중 리전 배포를 제공하고 각 인스턴스는 같은 리전에 기본 데이터 백업을 둔다. 조호가 가장 크게 개선해야 할 지점은 에이전트 <span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span>, 비용 관리, 에이전트 구축·배포다. AI 에이전트가 쓰는 조직 데이터에 대한 거버넌스가 아직 제한적이고, 비용 추적은 워크스페이스나 AI 소비량 예측, 네이티브 토큰 가시성이 부족하다. 에이전트 지식 소스를 위한 구성 가능한 인덱싱, 벡터 스토어, 시맨틱 검색 지원도 빠져 있다."}, {"order": 3, "name": "Globant", "quadrant_color": "#56606f", "quadrant_ko": "니치 플레이어", "overview_html": "글로반트의 제품은 GeneXus로, GeneXus Next 2025.02 버전을 기준으로 평가했으며 GeneXus for Agents, Glob.AI OS와 통합돼 있다. 애플리케이션 모델·규칙·로직으로 이루어진 모델 기반 지식 베이스를 중심에 두고, GeneXus for Agents는 코딩 에이전트가 <span class=\"gterm\" tabindex=\"0\">MCP<span class=\"gterm-note\">AI 에이전트가 외부 도구·데이터에 표준화된 방식으로 접근하게 하는 연결 규격(Model Context Protocol)</span></span> 서버를 통해 같은 지식 베이스에서 작업할 수 있게 하며, Glob.AI OS는 런타임 <span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span>·관측성·API를 <span class=\"gterm\" tabindex=\"0\">SaaS<span class=\"gterm-note\">설치 없이 인터넷으로 접속해 쓰는 구독형 소프트웨어 서비스</span></span> 또는 고객 호스팅 환경으로 제공한다. 글로반트에 가장 알맞은 활용 사례는 에이전틱 프로세스 워크플로 오케스트레이션이고, AI 기반 애플리케이션 현대화가 그 뒤를 바짝 따른다. GeneXus는 BPMN 기반 프로세스 모델링, 실행 가능한 워크플로, 비즈니스 규칙, 에이전트 단계를 결합해 결정론적 프로세스 로직과 AI 기반 행동이 같은 거버넌스 적용 애플리케이션 모델 안에서 동작하게 한다. 글로반트의 가장 강한 역량은 비즈니스 로직 설계, <span class=\"gterm\" tabindex=\"0\">데브옵스<span class=\"gterm-note\">개발과 운영을 한 흐름으로 묶어 배포를 빠르고 안전하게 반복하는 방법론(DevOps)</span></span>, 애플리케이션 보안이다. 모델 기반 지식 베이스 안에서 규칙과 데이터 모델링을 통합하고, GeneXus Server로 버전 관리와 브랜칭을 운영하며, 계층적 역할 구조를 Glob.AI OS의 검증·심사 기능으로 보완한다. 글로반트가 가장 크게 개선해야 할 지점은 에이전트 구축·배포, 에이전트 거버넌스, 비용 관리다. 에이전트 평가에 포괄적인 회귀 테스트와 <span class=\"gterm\" tabindex=\"0\">레드팀 테스트<span class=\"gterm-note\">공격자 입장에서 시스템의 약점을 일부러 찾아내는 보안 검증 방식</span></span>가 부족하고, 거버넌스는 에이전트·도구 전반에 걸친 일관된 권한 상속이 부족하며, 비용 관리는 플랫폼·AI 소비량을 아우르는 통합 <span class=\"gterm\" tabindex=\"0\">차지백<span class=\"gterm-note\">여러 부서가 공유하는 자원의 사용량만큼 비용을 각자에게 나눠 청구하는 방식</span></span> 체계가 없다."}, {"order": 4, "name": "Creatio", "quadrant_color": "#3a5a9c", "quadrant_ko": "비저너리", "overview_html": "크레아티오의 제품은 Creatio Business Studio와 Creatio AI Studio로, 버전 8.3.4를 기준으로 평가했다. 통합 플랫폼으로 제공되는 Business Studio는 <span class=\"gterm\" tabindex=\"0\">노코드<span class=\"gterm-note\">코드를 전혀 짜지 않고 화면 구성만으로 애플리케이션을 만드는 개발 방식</span></span> 애플리케이션 개발, 워크플로 자동화, CRM을 결합하며, AI Studio는 AI 에이전트를 만들고 통제하는 단일 환경을 제공한다. Azure나 AWS 위의 매니지드 클라우드로, 또는 고객이 직접 관리하는 배포로 제공된다. 최근 릴리스는 프롬프트 기반·구조화 워크플로 에이전트, <span class=\"gterm\" tabindex=\"0\">MCP<span class=\"gterm-note\">AI 에이전트가 외부 도구·데이터에 표준화된 방식으로 접근하게 하는 연결 규격(Model Context Protocol)</span></span>·HTTP 도구 연결, 사람 승인 정책, 에이전트 단위 소비 통제를 추가했다. 크레아티오에 가장 알맞은 활용 사례는 맞춤형 AI 에이전트 개발과 오케스트레이션이다. 이는 기업 데이터, 재사용 가능한 스킬, 워크플로 동작, 사람의 감독을 결합한 구성 가능한 AI 에이전트를 만들 수 있는 능력을 반영하며, 조직이 운영·고객 접점 프로세스 전반에 통제된 에이전트를 배포할 수 있게 한다. 크레아티오의 가장 강한 역량은 플랫폼 지원, 애플리케이션 보안, <span class=\"gterm\" tabindex=\"0\">데브옵스<span class=\"gterm-note\">개발과 운영을 한 흐름으로 묶어 배포를 빠르고 안전하게 반복하는 방법론(DevOps)</span></span>다. 애플리케이션과 에이전트를 개발·관리하는 일관된 환경을 제공하고, 애플리케이션 자원 전반에 공통 보안 통제를 적용하며, 체계적인 애플리케이션 생애주기와 배포 관행을 지원한다. 이런 역량 덕분에 크레아티오는 여러 팀과 환경에 걸쳐 통제된 애플리케이션 개발을 확장하려는 조직에 상대적으로 잘 맞는다. 크레아티오가 가장 크게 개선해야 할 지점은 테스트, 비즈니스 로직 설계, 비용 관리다. 테스트는 프로세스 모델·규칙·수식·커스텀 코드를 가로지르는 복잡한 로직에 대한 포괄적인 네이티브 계획·회귀 자동화가 부족하다. AI 비용 통제는 세밀한 내부 <span class=\"gterm\" tabindex=\"0\">차지백<span class=\"gterm-note\">여러 부서가 공유하는 자원의 사용량만큼 비용을 각자에게 나눠 청구하는 방식</span></span>과 예측 기능이 부족하다."}, {"order": 5, "name": "Oracle", "quadrant_color": "#0f766e", "quadrant_ko": "리더", "overview_html": "오라클의 제품은 Oracle APEX AI Application Generator로, Oracle AI Database에 포함돼 있으며 Oracle AI Autonomous Database와 Oracle Cloud Infrastructure(OCI)에서 제공돼 메타데이터 기반 앱을 데이터베이스 위에서 네이티브로 구동한다. 2026년 5월 출시된 Oracle APEX 26.1은 AI 에이전트와 개발자가 애플리케이션을 명확하고 구조화된 파일로 정의·생성·검증·소스 관리할 수 있게 하는 애플리케이션 정의 언어 APEXlang을 도입했다. 구성 가능한 AI 도구와 <span class=\"gterm\" tabindex=\"0\">가드레일<span class=\"gterm-note\">AI가 벗어나면 안 되는 행동 범위를 미리 정해 두는 안전장치</span></span>, SQL·애플리케이션 로직 생성을 돕는 AI 어시스턴트, 네이티브 워크플로와 함께 AI 에이전트가 도입됐다. Oracle APEX에 가장 알맞은 활용 사례는 에이전틱 프로세스 워크플로 오케스트레이션으로, 기업이 신뢰할 수 있고 통제된 데이터를 대상으로 AI 에이전트가 여러 단계의 비즈니스 프로세스를 직접 실행해야 하는 경우다. APEX는 Oracle Database 안에서 네이티브로 구동되며 로직과 메타데이터가 데이터가 있는 자리에서 실행되므로, APEX Workflow와 선언적 AI 에이전트를 미들웨어 없는 깊은 데이터베이스 통합·데이터베이스 네이티브 보안과 결합한다. 그 결과 에이전트는 통제되지 않은 자동화가 아니라 기업 통제 범위 안에서 승인된 데이터를 가져와 승인된 로직을 실행한다. Oracle APEX의 가장 강한 역량은 애플리케이션 보안, <span class=\"gterm\" tabindex=\"0\">에이전틱 워크플로<span class=\"gterm-note\">AI 에이전트가 여러 단계를 스스로 판단해 실행하는 업무 처리 흐름</span></span>, 플랫폼 지원이다. 프롬프트 완화를 통해 데이터베이스 통제를 AI 기능까지 확장하고, OCI를 통해 고가용성과 특정 시점 복구를 제공하며, 복잡한 환경 전반에서 환경 분리와 워크스페이스 격리를 단순화한다. Oracle APEX가 가장 크게 개선해야 할 지점은 테스트, 에이전트 구축·배포, 사용자 경험 설계다. AI 지원 테스트 생성은 지원하지만 독립된 네이티브 녹화·재생 테스트 스위트가 없고, 에이전트 구성은 여전히 개발자 중심이라 네이티브 평가 기능이 부족하며, 사용자 경험 설계 면에서는 배포된 애플리케이션의 네이티브 모바일·오프라인 기능을 서드파티 컴포넌트에 의존한다."}, {"order": 6, "name": "ServiceNow", "quadrant_color": "#0f766e", "quadrant_ko": "리더", "overview_html": "서비스나우의 제품은 ServiceNow AI Platform으로, App Engine, AI Agent Studio, AI Control Tower, Workflow Data Fabric, Process Mining, ServiceNow Otto(옛 Now Assist)를 아우른다. App Engine은 Build Agent를 내장한 AI 기반 <span class=\"gterm\" tabindex=\"0\">로우코드<span class=\"gterm-note\">코드를 적게 짜고 화면에서 끌어다 놓는 방식으로 애플리케이션을 만드는 개발 방식</span></span> 개발을 제공하고, AI Agent Studio는 에이전트 개발을, AI Control Tower는 <span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span>를 집중화하며, Workflow Data Fabric은 에이전트와 워크플로의 데이터 연결과 근거 확보를 맡는다. ServiceNow AI Platform은 <span class=\"gterm\" tabindex=\"0\">멀티테넌트<span class=\"gterm-note\">여러 고객이 같은 시스템 인프라를 나눠 쓰되 데이터는 서로 분리되는 구조</span></span> 클라우드로 구동되며 하이브리드와 고객·파트너 운영 프라이빗 인스턴스 옵션도 있다. 서비스나우에 가장 알맞은 활용 사례는 에이전틱 프로세스 워크플로 오케스트레이션으로, 강력한 프로세스 거버넌스를 반영한다. 맞춤 정책 점검을 포함해 위험·컴플라이언스 체계에 따라 AI 자산을 분류할 수 있게 하며, 역할 마스킹, 프롬프트 인젝션 점검 지원, AI 게이트웨이를 바탕으로 에이전트·도구·사람 참여자 전반의 데이터 접근을 보호한다. 서비스나우의 가장 강한 역량은 애플리케이션·데이터 연결성, <span class=\"gterm\" tabindex=\"0\">에이전틱 워크플로<span class=\"gterm-note\">AI 에이전트가 여러 단계를 스스로 판단해 실행하는 업무 처리 흐름</span></span>, 애플리케이션 보안이다. AI Agent Studio와 <span class=\"gterm\" tabindex=\"0\">MCP<span class=\"gterm-note\">AI 에이전트가 외부 도구·데이터에 표준화된 방식으로 접근하게 하는 연결 규격(Model Context Protocol)</span></span> 서버 제어, Integration Hub를 통해 도구·커넥터·데이터 소스를 아우르는 통제된 종합 디렉터리를 제공한다. 양방향 MCP를 지원하고, 탄탄한 역할 기반 워크플로 데이터 통제를 강제하며, 포괄적인 감사 로깅과 함께 제로트러스트 상시 인증을 제공한다. 서비스나우가 가장 크게 개선해야 할 지점은 비용 관리, 에이전트 구축·배포, 에이전트 거버넌스다. 조직·팀·사용자 단위 예산 설정을 포함한 대부분의 비용 관리 기능이 아직 제공되지 않고 토큰 추적은 미리보기 단계이며, 자체 모델 반입이나 오픈 웨이트 모델, 모델 라우팅 지원도 없다. 에이전트 거버넌스 면에서는 종단 간 LLM 모니터링과 안전성 평가가 아직 로드맵 단계다."}, {"order": 7, "name": "Appian", "quadrant_color": "#0f766e", "quadrant_ko": "리더", "overview_html": "어피안의 제품은 Appian Platform으로, 버전 26.5를 기준으로 평가했으며 <span class=\"gterm\" tabindex=\"0\">로우코드<span class=\"gterm-note\">코드를 적게 짜고 화면에서 끌어다 놓는 방식으로 애플리케이션을 만드는 개발 방식</span></span> 애플리케이션 개발, 프로세스 오케스트레이션, 케이스 관리, <span class=\"gterm\" tabindex=\"0\">데이터 패브릭<span class=\"gterm-note\">여러 시스템에 흩어진 데이터를 하나로 묶어 접근할 수 있게 하는 데이터 통합 계층</span></span>, AI를 하나의 통제된 플랫폼으로 통합한다. 이 플랫폼은 AWS(Amazon Web Services)에 호스팅된 매니지드 <span class=\"gterm\" tabindex=\"0\">SaaS<span class=\"gterm-note\">설치 없이 인터넷으로 접속해 쓰는 구독형 소프트웨어 서비스</span></span>인 Appian Cloud로 제공되며, 자체 관리 배포는 쿠버네티스 위에서 운영할 수 있다. 최근 릴리스는 Appian AI Agents, 확장된 Composer·AI Copilot 기능, Appian Cloud의 월간 릴리스 주기를 추가했다. 어피안에 가장 알맞은 활용 사례는 AI 기반 애플리케이션 현대화로, 기존 데이터와 워크플로 로직을 유지하면서 프로세스 중심·케이스 중심 애플리케이션을 현대화하는 능력을 반영한다. Appian Designer는 인터페이스, 프로세스 모델, 규칙, 통합을 지원하고, 데이터 패브릭은 기업 데이터에 대한 통합된 접근을 제공한다. AI 에이전트는 통제된 워크플로 안에서 정보를 가져오고 레코드를 갱신할 수 있다. 어피안의 가장 강한 역량은 비즈니스 로직 설계, 사용자 경험 설계, 애플리케이션 보안이다. 비즈니스 로직 설계에서는 실행 가능한 프로세스 모델, 케이스 관리, 의사결정, 사람의 승인, 장기 실행 워크플로 상태를 결합한다. 사용자 경험 설계에서는 웹·모바일 전반에 걸쳐 반응형 인터페이스, 재사용 가능한 컴포넌트, 레코드 중심 경험을 제공한다. 애플리케이션 보안에서는 애플리케이션·레코드·워크플로 전반에 역할 기반 권한과 세밀한 데이터 접근 통제를 적용한다. 어피안이 가장 크게 개선해야 할 지점은 테스트, 에이전트 구축·배포, 비용 관리다. 테스트는 버전 관리되는 평가 데이터셋, 체계적인 <span class=\"gterm\" tabindex=\"0\">레드팀 테스트<span class=\"gterm-note\">공격자 입장에서 시스템의 약점을 일부러 찾아내는 보안 검증 방식</span></span>, 에이전트 변경 전반의 자동 회귀 게이트가 부족하다. 에이전트 구축·배포는 체계적인 평가·승격을 위한 생애주기 통제가 적고, 비용 관리는 세밀한 AI 예산 책정·예측·내부 <span class=\"gterm\" tabindex=\"0\">차지백<span class=\"gterm-note\">여러 부서가 공유하는 자원의 사용량만큼 비용을 각자에게 나눠 청구하는 방식</span></span> 기능이 부족하다."}, {"order": 8, "name": "Retool", "quadrant_color": "#3a5a9c", "quadrant_ko": "비저너리", "overview_html": "리툴의 제품은 Retool 플랫폼으로, Retool Cloud와 엔터프라이즈 플랜의 자체 호스팅 Retool을 통해 평가했다. 프런트엔드 개발용 Retool Apps, LLM 작업 실행용 Retool Agents, 오케스트레이션용 Retool Workflows, Retool Database를 하나로 통합하며 이들 제품은 리소스·아이덴티티·시크릿 서비스를 공유한다. 리툴에 가장 알맞은 활용 사례는 에이전틱 프로세스 워크플로 오케스트레이션이다. LLM 추론을 결정론적 오케스트레이션, 기업 데이터, 사용자 대상 애플리케이션과 결합한다. Retool Agents는 원격 <span class=\"gterm\" tabindex=\"0\">MCP<span class=\"gterm-note\">AI 에이전트가 외부 도구·데이터에 표준화된 방식으로 접근하게 하는 연결 규격(Model Context Protocol)</span></span> 서버를 호출하고, Retool Apps는 작업을 시작하고 중요한 행동을 검토하는 휴먼인더루프 인터페이스를 제공한다. 리툴의 가장 강한 역량은 <span class=\"gterm\" tabindex=\"0\">에이전틱 워크플로<span class=\"gterm-note\">AI 에이전트가 여러 단계를 스스로 판단해 실행하는 업무 처리 흐름</span></span>, 애플리케이션·데이터 연결성, 플랫폼 지원이다. 개방형 추론을 결정론적 경로와 통합하고, REST·GraphQL을 통해 데이터베이스와 <span class=\"gterm\" tabindex=\"0\">SaaS<span class=\"gterm-note\">설치 없이 인터넷으로 접속해 쓰는 구독형 소프트웨어 서비스</span></span>를 네이티브로 연동하며, 공유 SSO와 역할 권한, 감사 통제로 모든 리소스를 관리한다. 리툴이 가장 크게 개선해야 할 지점은 테스트, 비용 관리, 에이전트 <span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span>다. 테스트는 애플리케이션과 에이전트를 아우르는 통합된 네이티브 프레임워크가 부족하고, 비용 관리는 사용량 측정 기준이 제각각이라 통합 추적과 예측이 어려우며, 에이전트 거버넌스는 세밀한 도구 단위 승인·감사 통제는 갖췄지만 생애주기 단위 정책은 아직 상대적으로 덜 세밀하다."}, {"order": 9, "name": "Salesforce", "quadrant_color": "#0f766e", "quadrant_ko": "리더", "overview_html": "세일즈포스의 제품은 Headless 360, Salesforce Platform, Agentforce, Data 360, MuleSoft, Flow, 보안 서비스로 구성된다. 개발자와 코딩 에이전트가 API와 <span class=\"gterm\" tabindex=\"0\">MCP<span class=\"gterm-note\">AI 에이전트가 외부 도구·데이터에 표준화된 방식으로 접근하게 하는 연결 규격(Model Context Protocol)</span></span> 서버를 통해 데이터·로직·에이전트에 접근할 수 있게 한다. 표준 라이선스나 Flex Credits로 가격을 책정하며, 무료 진입점인 Salesforce Foundations도 포함한다. 세일즈포스에 가장 알맞은 활용 사례는 보안·<span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span>·<span class=\"gterm\" tabindex=\"0\">가드레일<span class=\"gterm-note\">AI가 벗어나면 안 되는 행동 범위를 미리 정해 두는 안전장치</span></span>로, 애플리케이션과 에이전트 전반에 아이덴티티·데이터 접근·정책·AI 통제를 적용하는 능력을 반영한다. 세일즈포스는 세밀한 플랫폼 권한을 Agentforce 거버넌스, Trust Layer와 결합해 조직이 기존 기업 보안·거버넌스 통제를 유지하면서 AI 기반 애플리케이션과 워크플로를 배포할 수 있게 한다. 세일즈포스의 가장 강한 역량은 애플리케이션 보안, 플랫폼 지원, 사용자 경험 설계다. AI 전용 보호와 함께 세밀한 애플리케이션·데이터 권한을 강제하고, 플랫폼 전반의 중앙화된 관리·거버넌스를 제공하며, Lightning·Experience Cloud·Mobile Publisher와 헤드리스 인터페이스를 통해 다채널 경험을 지원한다. 세일즈포스가 개선할 지점은 에이전트 거버넌스, <span class=\"gterm\" tabindex=\"0\">데브옵스<span class=\"gterm-note\">개발과 운영을 한 흐름으로 묶어 배포를 빠르고 안전하게 반복하는 방법론(DevOps)</span></span>, 비즈니스 로직 설계다. 완전한 벤더 간 통제는 Agentforce 자체가 아니라 인접한 Agent Fabric 제어 평면에 의존한다. 단일 데브옵스 파이프라인을 통한 에이전트 <span class=\"gterm\" tabindex=\"0\">CI/CD<span class=\"gterm-note\">코드 변경을 자동으로 검증하고 배포까지 이어 주는 지속적 통합·배포 체계</span></span>는 최근 도입된 번들 메타데이터에 의존하며, 여러 설계자에게 프로세스 로직이 분산되면 솔루션이 커질수록 소유권 관리가 복잡해질 수 있다."}, {"order": 10, "name": "Siemens (Mendix)", "quadrant_color": "#0f766e", "quadrant_ko": "리더", "overview_html": "지멘스의 제품은 Mendix 플랫폼으로, RapidMiner의 AI Studio·Graph Studio와 함께 Siemens Intelligence Center X 브랜드 아래 자리한다. Mendix는 Agent Kit을 통한 맞춤 에이전트, Mendix AI Assistance(Maia)를 통한 AI 기반 개발, AI Studio에서의 ML 모델 구축을 지원한다. 플랫폼형 서비스, 고객 관리 하이브리드, <span class=\"gterm\" tabindex=\"0\">온프레미스<span class=\"gterm-note\">클라우드가 아니라 조직이 직접 소유한 서버에 설치해 운영하는 방식</span></span>, AWS GovCloud(US), 쿠버네티스 위 에어갭 구성까지 다양한 배포 유연성을 제공한다. 지멘스에 가장 알맞은 활용 사례는 에이전틱 프로세스 워크플로 오케스트레이션이다. 워크플로 에디터와 마이크로플로·나노플로 환경을 통해 팀이 중앙 정책, 위험 등급별 자율성, 역할 기반 접근 통제, 결정론적 폴백으로 통제되는 복잡한 다중 에이전트·사람-에이전트 워크플로를 설계할 수 있게 한다. Graph Studio는 구조화·비구조화 데이터 소스 전반에 걸친 시맨틱 그래프 기반 <span class=\"gterm\" tabindex=\"0\">데이터 패브릭<span class=\"gterm-note\">여러 시스템에 흩어진 데이터를 하나로 묶어 접근할 수 있게 하는 데이터 통합 계층</span></span>으로 데이터 연결성을 강화한다. 지멘스의 가장 강한 역량은 애플리케이션·데이터 연결성, <span class=\"gterm\" tabindex=\"0\">에이전틱 워크플로<span class=\"gterm-note\">AI 에이전트가 여러 단계를 스스로 판단해 실행하는 업무 처리 흐름</span></span>, 비즈니스 로직 설계다. 폭넓은 사전 구축·커뮤니티 커넥터를 제공하고, 에이전틱 활동과 결정론적 활동이 결정론적 폴백과 함께 안전하게 공존하게 하며, BPMN 워크플로와 Microflows 자동화를 Maia의 지원과 함께 결합해 복잡한 프로세스를 처리한다. 지멘스가 가장 크게 개선해야 할 지점은 에이전트 <span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span>, 에이전트 구축·배포, 테스트다. 에이전트 정책 강제 통제가 부족하고 에이전트 생성이 플랫폼 UI로 제한된다. 네이티브 테스트가 제한적이라 Menditect나 Sigrid의 Quality and Security Management 같은 유료 서드파티 애드온에 크게 의존해야 한다."}, {"order": 11, "name": "Pega", "quadrant_color": "#3a5a9c", "quadrant_ko": "비저너리", "overview_html": "페가의 제품은 Pega Infinity 26과 Pega Blueprint다. Pega Infinity는 Pega Cloud나 쿠버네티스 위 고객 관리 배포로 제공된다. Pega Blueprint는 비즈니스 요구사항을 Infinity Studio용 워크플로·데이터 모델·산출물로 변환하는 별도의 무료 AI 설계 도구다. 최근 릴리스는 통제된 AI 에이전트, AgentX API, Pega Agentic Process Fabric, <span class=\"gterm\" tabindex=\"0\">MCP<span class=\"gterm-note\">AI 에이전트가 외부 도구·데이터에 표준화된 방식으로 접근하게 하는 연결 규격(Model Context Protocol)</span></span>·A2A 연결을 추가했다. 페가에 가장 알맞은 활용 사례는 에이전틱 프로세스 워크플로 오케스트레이션으로, 결정론적 프로세스·규칙·사람의 작업·AI를 결합하는 깊이를 반영한다. 케이스 생애주기 안에서 에이전트가 데이터를 가져오고 행동을 실행할 수 있어, 복잡하고 장기간·여러 시스템에 걸친 워크플로를 자동화하려는 기업에 잘 맞는다. 페가의 가장 강한 역량은 <span class=\"gterm\" tabindex=\"0\">에이전틱 워크플로<span class=\"gterm-note\">AI 에이전트가 여러 단계를 스스로 판단해 실행하는 업무 처리 흐름</span></span>, 비즈니스 로직 설계, 테스트다. 케이스 관리, 프로세스 오케스트레이션, 의사결정, AI 에이전트를 통제된 워크플로 안에서 결합하고, 복잡한 규칙·의사결정·장기 실행 프로세스 상태를 지원하며, 애플리케이션과 워크플로 변경을 검증하는 비교적 강한 테스트 기능을 제공한다. 페가가 가장 크게 개선해야 할 지점은 비용 관리, 개발 역량, 애플리케이션 보안이다. AI 소비량은 모니터링할 수 있지만 네이티브 예산·예측 통제는 제한적이다. 전문 개발은 범용 코드 우선 워크플로보다 여전히 페가 고유의 규칙·애플리케이션 모델 중심이다. 플랫폼 수준의 애플리케이션 보안은 성숙했지만 AI 전용 보안 통제는 선도 경쟁사만큼 차별화돼 있지 않다."}, {"order": 12, "name": "Microsoft", "quadrant_color": "#0f766e", "quadrant_ko": "리더", "overview_html": "마이크로소프트의 Power Platform은 Power Apps, Power Automate, Power Pages, Copilot Studio, Dataverse로 구성된 클라우드 기반 <span class=\"gterm\" tabindex=\"0\">로우코드<span class=\"gterm-note\">코드를 적게 짜고 화면에서 끌어다 놓는 방식으로 애플리케이션을 만드는 개발 방식</span></span> 플랫폼이다. 이 서비스들이 함께 작동해 조직이 비즈니스 애플리케이션, AI 에이전트, 웹사이트, 프로세스 자동화 솔루션을 규모 있게 만들고 배포하고 통제할 수 있게 한다. Power Apps는 캔버스·호스팅 코드·모델 기반 애플리케이션을 지원하고, Power Pages는 외부 사이트를, Power Automate는 자동화를, Dataverse는 공유 데이터·애플리케이션 서비스를 제공한다. Copilot Studio는 근거 확보, 도구, 에이전트 플로, 테스트를 갖춘 에이전트 개발 환경을 제공한다. 커넥터가 <span class=\"gterm\" tabindex=\"0\">온프레미스<span class=\"gterm-note\">클라우드가 아니라 조직이 직접 소유한 서버에 설치해 운영하는 방식</span></span> 시스템 접근을 넓혀 주지만, 고객이 플랫폼 런타임을 자체 관리 인프라에 배포할 수는 없다. 마이크로소프트에 가장 알맞은 활용 사례는 보안·<span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span>·<span class=\"gterm\" tabindex=\"0\">가드레일<span class=\"gterm-note\">AI가 벗어나면 안 되는 행동 범위를 미리 정해 두는 안전장치</span></span>로, Power Platform 제품 전반에 걸친 중앙화된 관리, 아이덴티티 통제, 데이터 정책, 에이전트 거버넌스를 반영한다. Dataverse는 세밀한 데이터 접근 통제를 제공하고, Power Platform 관리 센터와 Copilot Studio는 애플리케이션·자동화·에이전트·커넥터·AI 소비량 전반으로 거버넌스를 확장한다. 마이크로소프트의 가장 강한 역량은 플랫폼 지원, 에이전트 구축·배포, <span class=\"gterm\" tabindex=\"0\">데브옵스<span class=\"gterm-note\">개발과 운영을 한 흐름으로 묶어 배포를 빠르고 안전하게 반복하는 방법론(DevOps)</span></span>다. Power Platform 관리 센터를 통해 관리와 거버넌스를 중앙화하고, Copilot Studio에서 로우코드 에이전트 저작과 배포를 결합하며, 솔루션·배포 파이프라인·소스 관리 통합을 통해 애플리케이션 생애주기 관리를 지원한다. 마이크로소프트가 가장 크게 개선해야 할 지점은 테스트, <span class=\"gterm\" tabindex=\"0\">에이전틱 워크플로<span class=\"gterm-note\">AI 에이전트가 여러 단계를 스스로 판단해 실행하는 업무 처리 흐름</span></span>, 애플리케이션·데이터 연결성이다. 테스트는 애플리케이션·자동화·에이전트 전반에서 덜 통합돼 있고, 에이전틱 워크플로는 서로 다른 저작·용량 모델을 가진 Copilot Studio와 Power Automate 사이의 조율이 필요하며, 연결성은 API 용량 계획과 온프레미스 게이트웨이 관리가 필요할 수 있다."}, {"order": 13, "name": "OutSystems", "quadrant_color": "#0f766e", "quadrant_ko": "리더", "overview_html": "아웃시스템즈의 제품은 OutSystems Developer Cloud(ODC)로, <span class=\"gterm\" tabindex=\"0\">SaaS<span class=\"gterm-note\">설치 없이 인터넷으로 접속해 쓰는 구독형 소프트웨어 서비스</span></span>·하이브리드·<span class=\"gterm\" tabindex=\"0\">온프레미스<span class=\"gterm-note\">클라우드가 아니라 조직이 직접 소유한 서버에 설치해 운영하는 방식</span></span> 모델로 제공되는 에버그린 플랫폼이다. ODC는 비주얼·<span class=\"gterm\" tabindex=\"0\">로우코드<span class=\"gterm-note\">코드를 적게 짜고 화면에서 끌어다 놓는 방식으로 애플리케이션을 만드는 개발 방식</span></span>·<span class=\"gterm\" tabindex=\"0\">프로코드<span class=\"gterm-note\">전통적인 방식으로 코드를 직접 작성하는 전문 개발자용 개발 방식</span></span> 개발을 하나의 통제된 애플리케이션 모델 위에 통합해, AI로 생성된 것을 포함한 비주얼 산출물과 코드 기반 산출물이 하나의 생애주기·소스 관리·<span class=\"gterm\" tabindex=\"0\">CI/CD<span class=\"gterm-note\">코드 변경을 자동으로 검증하고 배포까지 이어 주는 지속적 통합·배포 체계</span></span> 파이프라인을 공유하게 한다. 최근 릴리스는 애플리케이션·데이터·로직·테스트 산출물 전반에 걸친 AI 지원 생성과 도구 사용·<span class=\"gterm\" tabindex=\"0\">MCP<span class=\"gterm-note\">AI 에이전트가 외부 도구·데이터에 표준화된 방식으로 접근하게 하는 연결 규격(Model Context Protocol)</span></span> 연결을 지원하는 네이티브 AI 에이전트를 추가했다. 아웃시스템즈에 가장 알맞은 활용 사례는 맞춤형 애플리케이션 개발이다. 전체 생애주기 딜리버리에서의 깊이를 반영해, ODC는 IDE 통합, CLI, 소스 관리 브랜칭, 풀 리퀘스트 워크플로로 전문 개발자를 지원하는 동시에 로우코드 빌더도 제공한다. ODC는 AI 생성과 네이티브 테스트 생성·실행을 짝지어, 빨라진 산출물이 여전히 검증 가능하도록 한다. 이 덕분에 규모 있게 복잡한 애플리케이션을 만들고 유지하려는 기업에 잘 맞는다. 아웃시스템즈의 가장 강한 역량은 <span class=\"gterm\" tabindex=\"0\">데브옵스<span class=\"gterm-note\">개발과 운영을 한 흐름으로 묶어 배포를 빠르고 안전하게 반복하는 방법론(DevOps)</span></span>, 애플리케이션 보안, 사용자 경험 설계다. 승인 게이트를 갖춘 체계적인 환경 승격을 제공하고, 권한을 인지하는 통제와 프롬프트 완화로 AI를 통제하며, 통제된 디자인 시스템 위에서 오프라인 우선 데이터 처리를 갖춘 네이티브 모바일 애플리케이션을 제공한다. 아웃시스템즈가 가장 크게 개선해야 할 지점은 비용 관리, 에이전트 구축·배포, 플랫폼 지원이다. 네이티브 예산 통제는 초과를 막기보다 가시성에 초점이 맞춰져 있고, 정의된 RPO·RTO와 리전 장애 조치를 갖춘 재해 복구는 기본 플랫폼에 포함돼 있지 않아 추가 구매가 필요하다."}];
const byOrder = Object.fromEntries(DATA.map(d => [String(d.order), d]));

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

const panel = document.getElementById('panel');
const panelBody = document.getElementById('panel-body');

function showDetail(id) {
  const item = byOrder[id];
  if (!item) return;
  document.querySelectorAll('#chart .pt-group').forEach(g => g.classList.toggle('is-active', g.dataset.id === id));
  const numHtml = `<span class="tech-num" style="background:${item.quadrant_color}">${item.order}</span>`;
  panelBody.innerHTML = `<h3>${numHtml}${esc(item.name)}<span class="badge" style="background:${item.quadrant_color};color:#fff">${esc(item.quadrant_ko)}</span></h3>` +
    `<p class="peek-body">${item.overview_html}</p>`;
  panel.classList.add('is-open');
  panel.scrollTop = 0;
}

function closePanel() {
  panel.classList.remove('is-open');
  document.querySelectorAll('#chart .pt-group').forEach(g => g.classList.remove('is-active'));
}

document.querySelectorAll('#chart .pt-group').forEach(g => {
  g.addEventListener('click', () => showDetail(g.dataset.id));
});
document.getElementById('panel-close').addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

const dragHandle = document.getElementById('panel-drag');
let dragOffset = null;
function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }
dragHandle.addEventListener('pointerdown', e => {
  const rect = panel.getBoundingClientRect();
  panel.style.left = rect.left + 'px'; panel.style.top = rect.top + 'px';
  panel.style.right = 'auto'; panel.style.bottom = 'auto';
  dragOffset = { x: e.clientX - rect.left, y: e.clientY - rect.top };
  panel.classList.add('is-dragging');
  dragHandle.setPointerCapture(e.pointerId);
});
dragHandle.addEventListener('pointermove', e => {
  if (!dragOffset) return;
  const rect = panel.getBoundingClientRect();
  const x = clamp(e.clientX - dragOffset.x, 8, window.innerWidth - rect.width - 8);
  const y = clamp(e.clientY - dragOffset.y, 8, window.innerHeight - rect.height - 8);
  panel.style.left = x + 'px'; panel.style.top = y + 'px';
});
dragHandle.addEventListener('pointerup', () => { dragOffset = null; panel.classList.remove('is-dragging'); });

const PANEL_SCALE_BASE = 420;
function updatePanelScale() {
  const scale = clamp(panel.getBoundingClientRect().width / PANEL_SCALE_BASE, 0.75, 1.9);
  panel.style.setProperty('--panel-scale', scale.toFixed(3));
}
new ResizeObserver(updatePanelScale).observe(panel);
panel.addEventListener('mouseup', updatePanelScale);

document.addEventListener('click', e => {
  if (e.target.closest('#panel')) return;
  if (e.target.closest('.pt-group')) return;
  closePanel();
});
</script>
