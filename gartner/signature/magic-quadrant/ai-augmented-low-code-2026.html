<style>
:root { color-scheme: light; --ink: #191f28; --muted: #6b7684; --line: #e5e8eb;
  --paper: #ffffff; --wash: #f4f5f7; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--wash); color: var(--ink);
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Noto Sans KR", sans-serif;
  line-height: 1.65; padding-block: 32px; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px; }
header.page-head { margin-bottom: 24px; }
.back-link { margin: 0 0 10px; font-size: 13px; }
.back-link a { color: #2D69C1; font-weight: 600; text-decoration: none; }
.back-link a:hover { text-decoration: underline; }
h1 { margin: 0 0 8px; font-size: 26px; }
.note { margin: 0; color: var(--muted); font-size: 14px; }
.chart-card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
  padding: 24px; margin: 0 auto 20px; max-width: 760px; }
svg.mq-svg { width: 100%; height: auto; display: block; }
.mq-svg .gterm { cursor: help; }
.gterm { position: relative; border-bottom: 1px dashed rgb(45, 105, 193); cursor: help;
  outline-offset: 2px; }
.gterm-note { position: absolute; left: 0; top: calc(100% + 6px); z-index: 20; width: max-content;
  max-width: min(320px, 78vw); padding: 10px 13px; border: 1px solid #c0ddfc; border-radius: 4px;
  background: #fff; box-shadow: 0 6px 20px rgba(12, 39, 101, .16);
  font-size: 13px; line-height: 1.6; font-weight: 400; color: rgb(51, 52, 63);
  opacity: 0; visibility: hidden; transition: opacity .12s ease; }
.gterm:hover .gterm-note, .gterm:focus .gterm-note, .gterm:focus-within .gterm-note {
  opacity: 1; visibility: visible; }
.mq-svg .mq-outline { fill: none; stroke: #191f28; stroke-width: 2; }
.mq-svg .mq-divider { stroke: #c7ccd4; stroke-width: 1.5; }
.mq-svg .mq-qlabel { font-weight: 700; letter-spacing: .03em; }
.mq-svg .mq-axis { font-size: 13px; fill: var(--muted); font-weight: 600; }
.mq-svg .mq-cap { font-size: 11px; fill: var(--muted); }
.mq-svg .pt { stroke: var(--paper); stroke-width: 1.5; cursor: pointer; }
.mq-svg .pt:hover { stroke: var(--ink); stroke-width: 2; }
.mq-svg .pt-num { fill: #fff; font-weight: 700; pointer-events: none; }
.q-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 14px 0 0;
  padding: 0; list-style: none; font-size: 12.5px; color: var(--muted); }
.q-legend li { display: flex; align-items: center; gap: 6px; }
.q-legend .chip { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.tech-num { flex: none; width: 23px; height: 23px; border-radius: 50%; color: #fff;
  font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.badge { display: inline-block; margin-left: 8px; padding: 2px 9px; border-radius: 999px;
  font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--wash); color: var(--muted); }
.content-area { position: relative; }
.content-area:has(.peek-item:target) .idx-list { display: none; }
.idx-list { display: grid; grid-template-columns: 1fr; gap: 2px; }
@media (min-width: 640px) {
  .idx-list { grid-template-columns: 1fr 1fr; gap: 2px 14px; }
}
.idx-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px;
  text-decoration: none; color: var(--ink); }
.idx-row:hover { background: var(--wash); }
.idx-title { flex: 1 1 auto; font-weight: 600; font-size: 14px; }
.peek-item { display: none; background: var(--paper); border: 1px solid var(--line);
  border-radius: 12px; padding: 22px 24px; position: relative; }
.peek-item:target { display: block; }
.peek-close { display: inline-block; margin-bottom: 14px; font-size: 13px; font-weight: 700;
  color: #0f766e; text-decoration: none; }
.peek-close:hover { text-decoration: underline; }
.peek-eyebrow { margin: 0 0 4px; font-size: 12px; font-weight: 700; letter-spacing: .02em; }
.peek-title { margin: 0 0 10px; font-size: 21px; display: flex; align-items: center;
  gap: 10px; flex-wrap: wrap; }
.peek-body { font-size: 15.5px; line-height: 1.75; color: var(--ink); }
.sc-section { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.sc-heading { margin: 0 0 8px; font-size: 13px; font-weight: 700; letter-spacing: .02em;
  text-transform: uppercase; }
.sc-heading.is-strength { color: #0f766e; }
.sc-heading.is-caution { color: #b45309; }
.sc-list { margin: 0 0 4px; padding-left: 18px; }
.sc-list + .sc-heading { margin-top: 16px; }
.sc-list li { margin: 0 0 9px; font-size: 14.5px; line-height: 1.7; }
.sc-list li:last-child { margin-bottom: 0; }

.wrap { max-width: 1320px; position: relative; }
.mq-svg .pt-group.is-active { transform-box: fill-box; transform-origin: center; transform: scale(1.4); }
.mq-svg .pt-group.is-active .pt { stroke: #fff; stroke-width: 1.8; }
#panel { position: fixed; right: 24px; bottom: 24px; width: min(420px, calc(100vw - 32px));
  height: min(72vh, 560px); min-width: 280px; min-height: 180px; max-width: 92vw;
  max-height: 90vh; overflow: auto; resize: both; background: rgba(255, 255, 255, .85);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: 14px; padding: 20px;
  box-shadow: 0 12px 32px rgba(25, 31, 40, .18); z-index: 20;
  transform: translateY(12px); opacity: 0; pointer-events: none;
  transition: transform .18s ease, opacity .18s ease;
  font-size: calc(14px * var(--panel-scale, 1)); }
#panel.is-open { transform: translateY(0); opacity: 1; pointer-events: auto; }
#panel.is-dragging { transition: none; }
#panel h3 { margin: 0 0 10px; padding-right: 26px; font-size: 1.3em; display: flex;
  align-items: center; gap: 8px; }
#panel .peek-body { font-size: 1em; }
#panel-drag { margin: -20px -20px 10px; padding: 8px 0; text-align: center;
  font-size: 11px; letter-spacing: .08em; color: var(--muted); cursor: grab;
  border-bottom: 1px dashed var(--line); user-select: none; }
#panel-drag:active { cursor: grabbing; }
#panel-close { position: absolute; top: 14px; right: 14px; width: 26px; height: 26px;
  border: none; border-radius: 999px; background: var(--wash); color: var(--muted);
  font-size: 15px; line-height: 1; cursor: pointer; }
#panel-close:hover { background: var(--line); }
#panel-resize-hint { position: absolute; bottom: 3px; right: 5px; font-size: 10px;
  color: var(--muted); opacity: .55; pointer-events: none; }
@media (max-width: 700px) {
  #panel { left: 0; right: 0; bottom: 0; width: auto; max-height: 60vh;
    border-radius: 16px 16px 0 0; resize: none; }
  #panel-drag { display: none; }
  #panel-resize-hint { display: none; }
}
</style></head>

<script>
const DATA = [{"order": 1, "name": "Huawei", "quadrant_color": "#56606f", "quadrant_ko": "니치 플레이어", "overview_html": "화웨이의 제품은 매니지드 서비스로 제공되는 Huawei Cloud Astro Zero로, Astro Pro·Astro Canvas와 함께 묶여 있다. 비주얼 설계 스튜디오와 런타임 엔진을 드래그 앤 드롭 모델링, 스크립트 엔진, 온라인 IDE, 별도의 샌드박스·배포 환경과 결합했다. AIGC 기반 코딩, 자연어-쿼리 변환 기능, AI 어시스턴트 위젯도 포함한다. 화웨이에 가장 알맞은 활용 사례는 AI 기반 애플리케이션 현대화다. 객체, 표준·반응형 고급 페이지, 스크립트 엔진이 시민 개발자와 전문 개발자 모두를 지원하며, 3,000개가 넘는 API와 500개가 넘는 컴포넌트, KooGallery 마켓플레이스로 이루어진 생태계가 Huawei Cloud 안에서 데이터 중심 애플리케이션의 폭넓은 확장을 가능하게 한다. 화웨이의 가장 강한 역량은 애플리케이션·데이터 연결성, <span class=\"gterm\" tabindex=\"0\">데브옵스<span class=\"gterm-note\">개발과 운영을 한 흐름으로 묶어 배포를 빠르고 안전하게 반복하는 방법론(DevOps)</span></span>, 플랫폼 지원이다. 연결성 면에서는 커넥터와 Kafka·ROMA Connect를 통한 데이터 접근, 여러 클라우드 서비스에 걸친 통합이 기업 데이터 시나리오를 뒷받침한다. 데브옵스 면에서는 그래픽 기반 플로우와 BPM이 실행 가능한 프로세스와 장기 실행 워크플로 모델링을 제공한다. 플랫폼 지원 면에서는 역할 기반 접근 제어, 메타데이터 <span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span>, 환경 격리, Huawei Cloud 인프라 위의 다중 리전 배포가 탄탄한 거버넌스와 복원력을 제공한다. 화웨이가 가장 크게 개선해야 할 지점은 <span class=\"gterm\" tabindex=\"0\">에이전틱 워크플로<span class=\"gterm-note\">AI 에이전트가 여러 단계를 스스로 판단해 실행하는 업무 처리 흐름</span></span>, 에이전트 구축·배포, 테스트다. 에이전트 개발이 별도 플랫폼에 머물러 있어 네이티브 에이전트 오케스트레이션이 제한적이고, 프롬프트 기반 저작·AI 전용 보안·네이티브 테스트 자동화 프레임워크도 제한적이라 외부 도구가 필요하다. 화웨이는 이 문서의 초안 검토나 추가 정보 요청에 응하지 않았다. 따라서 가트너의 분석은 다른 신뢰할 만한 출처를 근거로 했다.", "sc_html": "<div class=\"sc-section\"><p class=\"sc-heading is-strength\">강점</p><ul class=\"sc-list\"><li><strong>사업 역량:</strong> 화웨이 클라우드는 화웨이 테크놀로지스의 클라우드 사업 부문으로, 전액 출자 자회사인 화웨이 클라우드 컴퓨팅 테크놀로지를 통해 운영된다. 이는 Astro Zero에 꾸준한 엔지니어링·운영 투자를 이어가는 크고 자원이 풍부한 공급사의 뒷받침을 더해, 고객에게 플랫폼 투자의 연속성과 장기 지원을 보장한다.</li><li><strong>운영:</strong> 화웨이 클라우드의 기반 인프라는 폭넓은 컴플라이언스 인증과 공개된 서비스수준협약, 다중 지역 복원력을 플랫폼에 제공한다. 이런 역량은 고객이 중요 애플리케이션의 고가용성을 확보하고 엄격한 안정성·규제 요건을 충족하는 데 도움이 된다.</li><li><strong>혁신:</strong> 화웨이는 업종별로 조정된 판구 대형 모델과 자연어 설명으로 애플리케이션 구성요소를 생성하는 AI, 자연어-쿼리 변환 도구를 내장해 Astro Zero를 차별화한다. 고객은 정부, 금융, 제조 등 특정 업종에 맞춰진 AI 기능을 활용할 수 있다.</li></ul><p class=\"sc-heading is-caution\">주의할 점</p><ul class=\"sc-list\"><li><strong>제품 전략:</strong> 화웨이는 에이전트형 기능을 Astro Zero에 직접 내장하는 대신 별도의 판구·모델아츠 플랫폼에 배치하고, Astro Zero 자체에는 지식 베이스 기반 AI 어시스턴트 위젯만 제공한다. 그 결과 이 플랫폼은 비주얼 에이전트 워크플로 모델링, 다단계 에이전트 오케스트레이션, 에이전트 평가, 에이전트 전용 <span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span>·모니터링 같은 기능을 기본으로 지원하지 않는다.</li><li><strong>제품/서비스(테스트):</strong> Astro Zero는 기본적인 샌드박스 테스트를 넘어서는 종합적인 네이티브 테스트 자동화나 전문화된 프런트엔드 검증 기능을 갖추지 않았다. 조직은 화웨이 배포를 확장할 때 접근성과 보안을 검증할 자체 테스트 도구를 구해 통합해야 하며, 이는 전체 구축 비용을 높인다.</li><li><strong>지역 전략:</strong> 중국과 아시아·태평양 지역 밖에서 운영하는 글로벌 조직은 제한된 지역 가용성과 지원, 도달 범위에 부딪힐 수 있다. Astro Zero는 주로 화웨이 클라우드의 중국·아시아·태평양 지역에서 제공되며, 문서 또한 중국 지역 배포에 치우쳐 있다.</li></ul></div>"}, {"order": 2, "name": "Zoho", "quadrant_color": "#56606f", "quadrant_ko": "니치 플레이어", "overview_html": "조호의 제품은 Zoho Creator로, 하이브리드·<span class=\"gterm\" tabindex=\"0\">온프레미스<span class=\"gterm-note\">클라우드가 아니라 조직이 직접 소유한 서버에 설치해 운영하는 방식</span></span> 옵션을 갖춘 <span class=\"gterm\" tabindex=\"0\">멀티테넌트<span class=\"gterm-note\">여러 고객이 같은 시스템 인프라를 나눠 쓰되 데이터는 서로 분리되는 구조</span></span> 클라우드 서비스로 제공된다. AI 기반 개발을 돕는 Zia AI 에이전트, 맞춤 AI 에이전트 개발용 Zia Agent Studio, AI 기반 테스트용 Zoho QEngine을 포함한다. 별도 구매가 필요한 Zoho Sprints는 업무 관리에 쓰이고, Zoho <span class=\"gterm\" tabindex=\"0\">MCP<span class=\"gterm-note\">AI 에이전트가 외부 도구·데이터에 표준화된 방식으로 접근하게 하는 연결 규격(Model Context Protocol)</span></span>는 서드파티 AI 코딩 에이전트에 도구 접근을 열어 준다. 조호에 가장 알맞은 활용 사례는 맞춤형 애플리케이션 개발로, 맞춤형 <span class=\"gterm\" tabindex=\"0\">로우코드<span class=\"gterm-note\">코드를 적게 짜고 화면에서 끌어다 놓는 방식으로 애플리케이션을 만드는 개발 방식</span></span> 솔루션에서의 강점을 보여 준다. 플랜 에이전트는 사람이 승인한 통합을 반영해 편집 가능한 요구사항 문서를 생성하며, 이를 빌드 에이전트가 애플리케이션 생성에 활용한다. 플랫폼에서 만든 애플리케이션에 AI 챗봇으로 심을 수 있는 구성 가능한 챗 에이전트도 제공한다. 조호의 가장 강한 역량은 사용자 경험 설계, 애플리케이션·데이터 연결성, 플랫폼 지원이다. 내장 모바일 기기 관리와 함께 네이티브 iOS·안드로이드 앱 개발을 지원하고, Zoho Flow를 통해 1,000개가 넘는 사전 구축 커넥터에 접근할 수 있으며, 9개 데이터센터에 걸친 다중 리전 배포를 제공하고 각 인스턴스는 같은 리전에 기본 데이터 백업을 둔다. 조호가 가장 크게 개선해야 할 지점은 에이전트 <span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span>, 비용 관리, 에이전트 구축·배포다. AI 에이전트가 쓰는 조직 데이터에 대한 거버넌스가 아직 제한적이고, 비용 추적은 워크스페이스나 AI 소비량 예측, 네이티브 토큰 가시성이 부족하다. 에이전트 지식 소스를 위한 구성 가능한 인덱싱, 벡터 스토어, 시맨틱 검색 지원도 빠져 있다.", "sc_html": "<div class=\"sc-section\"><p class=\"sc-heading is-strength\">강점</p><ul class=\"sc-list\"><li><strong>업종 전략:</strong> 조호는 특정 영역에 특화된 강력한 파트너 생태계를 갖췄다. 가벼운 구성과 커스터마이징만으로도 제조, 교육, 전문 서비스 업종 전반에 걸쳐 신뢰할 만한 구축 사례를 내놓는다. 업종 특화 솔루션을 찾는 고객은 이 탄탄한 파트너 생태계로부터 이익을 얻을 수 있다.</li><li><strong>지역 전략:</strong> 조호는 아시아, 유럽, 북미 전역의 데이터센터를 바탕으로 더 강한 글로벌 고객·파트너 생태계 기반을 계속 구축하고 있다. 현지화된 UI 경험과 글로벌 지원망도 제공한다. 고객은 현지 지원 역량과 향상된 애플리케이션 성능의 혜택을 누릴 수 있다.</li><li><strong>제품/서비스:</strong> 지아(Zia)와 그 구축 에이전트가 뒷받침하는 Zoho Creator의 사용자 경험은 더 쉬운 AI 증강 애플리케이션 개발을 제공한다. 기존 레거시 시스템을 자동화된 프로세스로 확장하는 데 집중한 점이 이 니치 영역에서 조호의 신뢰도를 뒷받침한다. 개발 팀은 더 완만한 학습 곡선의 혜택을 누리며 <span class=\"gterm\" tabindex=\"0\">로우코드<span class=\"gterm-note\">코드를 적게 짜고 화면에서 끌어다 놓는 방식으로 애플리케이션을 만드는 개발 방식</span></span> 애플리케이션을 빠르게 만들 수 있다.</li></ul><p class=\"sc-heading is-caution\">주의할 점</p><ul class=\"sc-list\"><li><strong>시장 대응력:</strong> 조호의 AI 증강 개발 요구에 대한 대응은 이 시장의 선도 제품들에 비해 느리다. 예를 들어 <span class=\"gterm\" tabindex=\"0\">MCP<span class=\"gterm-note\">AI 에이전트가 외부 도구·데이터에 표준화된 방식으로 접근하게 하는 연결 규격(Model Context Protocol)</span></span> 관련 제품 기능은 AI 코딩 에이전트를 활용한 애플리케이션 개발 쪽에서 여전히 발전하는 중이다. 고급 AI 지원 개발 역량을 찾는 고객은 특정 사용 사례를 제한하거나 도입을 늦추는 한계에 부딪힐 수 있다.</li><li><strong>마케팅 실행:</strong> 조호의 마케팅 메시지는 뚜렷한 차별성이 부족하고, 더 폭넓은 AI 증강 개발 담론과 비슷하게 맞춰져 있다. 레거시 현대화 전략도 기존 시스템과의 통합을 통한 프로세스 자동화에 더 초점을 맞추며, 레거시 애플리케이션 자체의 현대화에는 상대적으로 덜 집중한다. 고객은 조호의 현대화 역량이 어디까지인지, 어떤 한계가 있는지 이해하기 어려울 수 있다.</li><li><strong>영업 전략:</strong> 조호는 영업 조직을 확장할 계획이 없다. 가격과 자체 Zoho LLM으로 차별화를 꾀하지만, 제3자 모델에 의존하는 고객은 그 모델을 별도로 라이선스해야 한다. 이런 구조는 총비용 계산을 복잡하게 만들 수 있다. 고객은 플랫폼과 관련 라이선스 모델 전반의 AI 관련 비용을 정확히 예측하기 어려울 수 있다.</li></ul></div>"}, {"order": 3, "name": "Globant", "quadrant_color": "#56606f", "quadrant_ko": "니치 플레이어", "overview_html": "글로반트의 제품은 GeneXus로, GeneXus Next 2025.02 버전을 기준으로 평가했으며 GeneXus for Agents, Glob.AI OS와 통합돼 있다. 애플리케이션 모델·규칙·로직으로 이루어진 모델 기반 지식 베이스를 중심에 두고, GeneXus for Agents는 코딩 에이전트가 <span class=\"gterm\" tabindex=\"0\">MCP<span class=\"gterm-note\">AI 에이전트가 외부 도구·데이터에 표준화된 방식으로 접근하게 하는 연결 규격(Model Context Protocol)</span></span> 서버를 통해 같은 지식 베이스에서 작업할 수 있게 하며, Glob.AI OS는 런타임 <span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span>·관측성·API를 <span class=\"gterm\" tabindex=\"0\">SaaS<span class=\"gterm-note\">설치 없이 인터넷으로 접속해 쓰는 구독형 소프트웨어 서비스</span></span> 또는 고객 호스팅 환경으로 제공한다. 글로반트에 가장 알맞은 활용 사례는 에이전틱 프로세스 워크플로 오케스트레이션이고, AI 기반 애플리케이션 현대화가 그 뒤를 바짝 따른다. GeneXus는 BPMN 기반 프로세스 모델링, 실행 가능한 워크플로, 비즈니스 규칙, 에이전트 단계를 결합해 결정론적 프로세스 로직과 AI 기반 행동이 같은 거버넌스 적용 애플리케이션 모델 안에서 동작하게 한다. 글로반트의 가장 강한 역량은 비즈니스 로직 설계, <span class=\"gterm\" tabindex=\"0\">데브옵스<span class=\"gterm-note\">개발과 운영을 한 흐름으로 묶어 배포를 빠르고 안전하게 반복하는 방법론(DevOps)</span></span>, 애플리케이션 보안이다. 모델 기반 지식 베이스 안에서 규칙과 데이터 모델링을 통합하고, GeneXus Server로 버전 관리와 브랜칭을 운영하며, 계층적 역할 구조를 Glob.AI OS의 검증·심사 기능으로 보완한다. 글로반트가 가장 크게 개선해야 할 지점은 에이전트 구축·배포, 에이전트 거버넌스, 비용 관리다. 에이전트 평가에 포괄적인 회귀 테스트와 <span class=\"gterm\" tabindex=\"0\">레드팀 테스트<span class=\"gterm-note\">공격자 입장에서 시스템의 약점을 일부러 찾아내는 보안 검증 방식</span></span>가 부족하고, 거버넌스는 에이전트·도구 전반에 걸친 일관된 권한 상속이 부족하며, 비용 관리는 플랫폼·AI 소비량을 아우르는 통합 <span class=\"gterm\" tabindex=\"0\">차지백<span class=\"gterm-note\">여러 부서가 공유하는 자원의 사용량만큼 비용을 각자에게 나눠 청구하는 방식</span></span> 체계가 없다.", "sc_html": "<div class=\"sc-section\"><p class=\"sc-heading is-strength\">강점</p><ul class=\"sc-list\"><li><strong>시장 이해도:</strong> 글로반트는 유지보수성을 희생하지 않으면서 생성형 AI로 가속화하려는 기업을 돕는다. Nexa 어시스턴트는 구조화된 객체 위에서 동작하고, 그 바탕이 되는 지식 베이스가 핵심 비즈니스 로직을 그대로 유지한다. 고객은 완전히 통제되고 미래에도 유효한 모델을 유지하면서 시스템을 빠르게 현대화할 수 있다.</li><li><strong>제품/서비스:</strong> 글로반트는 모델 기반 설계에 AI 지원 객체 생성과 대화형 제어를 결합했다. 이 플랫폼은 .NET API 객체를 <span class=\"gterm\" tabindex=\"0\">MCP<span class=\"gterm-note\">AI 에이전트가 외부 도구·데이터에 표준화된 방식으로 접근하게 하는 연결 규격(Model Context Protocol)</span></span> 서버를 통해 도구로 노출하는 기능도 지원한다. 고객은 하나의 개발 모델 안에서 통상적인 업무 애플리케이션을 만들면서 동시에 에이전트형 워크플로를 내장할 수 있다.</li><li><strong>마케팅 실행:</strong> 글로반트는 GeneXus를 AI Pods와 업종별 솔루션을 포함한 더 넓은 기업용 AI 포트폴리오와 정렬했다. 이 통합된 접근은 제품과 컨설팅 사업 양쪽을 통해 기업 구매자에게 접근할 통로를 제공한다. 고객은 이 체계화된 AI 공급 모델을 활용해 다양한 업종에 걸쳐 도입을 확장할 수 있다.</li></ul><p class=\"sc-heading is-caution\">주의할 점</p><ul class=\"sc-list\"><li><strong>제품 전략:</strong> 글로반트는 역량을 여러 모듈형 제품과 부가 제품군에 나눠 배치한다. 이렇게 분절된 구조는 라이선스 경계와 기능별 사용 권한, 생애주기 책임을 알아보기 어렵게 만들 수 있다. 고객은 플랫폼을 선택하기 전에 필요한 기능을 구체적인 계약 항목에 대응시켜 확인해야 한다.</li><li><strong>영업 실행·가격정책:</strong> 글로반트는 GeneXus의 전체 기업용 가격을 공개하지 않고, 대신 유통·파트너 네트워크에 의존한다. 상업적 제안은 개발 라이선스와 전문 서비스, 토큰 단위로 과금되는 AI 용량을 함께 묶는다. 고객은 다년 계약을 맺기 전에 통합된 총비용 모델을 요청해야 한다.</li><li><strong>운영:</strong> 글로반트는 클라우드 환경을 주로 프로토타이핑용으로 설계하며, 운영 환경 배포에는 고객이 직접 관리하는 런타임이 필요하다. 이런 구조는 SLA와 확장, 재해 복구에 대한 책임을 그대로 고객에게 넘긴다. 조직은 다른 벤더와 비교할 때 인프라 지원 비용도 함께 예산에 반영해야 한다.</li></ul></div>"}, {"order": 4, "name": "Creatio", "quadrant_color": "#3a5a9c", "quadrant_ko": "비저너리", "overview_html": "크레아티오의 제품은 Creatio Business Studio와 Creatio AI Studio로, 버전 8.3.4를 기준으로 평가했다. 통합 플랫폼으로 제공되는 Business Studio는 <span class=\"gterm\" tabindex=\"0\">노코드<span class=\"gterm-note\">코드를 전혀 짜지 않고 화면 구성만으로 애플리케이션을 만드는 개발 방식</span></span> 애플리케이션 개발, 워크플로 자동화, CRM을 결합하며, AI Studio는 AI 에이전트를 만들고 통제하는 단일 환경을 제공한다. Azure나 AWS 위의 매니지드 클라우드로, 또는 고객이 직접 관리하는 배포로 제공된다. 최근 릴리스는 프롬프트 기반·구조화 워크플로 에이전트, <span class=\"gterm\" tabindex=\"0\">MCP<span class=\"gterm-note\">AI 에이전트가 외부 도구·데이터에 표준화된 방식으로 접근하게 하는 연결 규격(Model Context Protocol)</span></span>·HTTP 도구 연결, 사람 승인 정책, 에이전트 단위 소비 통제를 추가했다. 크레아티오에 가장 알맞은 활용 사례는 맞춤형 AI 에이전트 개발과 오케스트레이션이다. 이는 기업 데이터, 재사용 가능한 스킬, 워크플로 동작, 사람의 감독을 결합한 구성 가능한 AI 에이전트를 만들 수 있는 능력을 반영하며, 조직이 운영·고객 접점 프로세스 전반에 통제된 에이전트를 배포할 수 있게 한다. 크레아티오의 가장 강한 역량은 플랫폼 지원, 애플리케이션 보안, <span class=\"gterm\" tabindex=\"0\">데브옵스<span class=\"gterm-note\">개발과 운영을 한 흐름으로 묶어 배포를 빠르고 안전하게 반복하는 방법론(DevOps)</span></span>다. 애플리케이션과 에이전트를 개발·관리하는 일관된 환경을 제공하고, 애플리케이션 자원 전반에 공통 보안 통제를 적용하며, 체계적인 애플리케이션 생애주기와 배포 관행을 지원한다. 이런 역량 덕분에 크레아티오는 여러 팀과 환경에 걸쳐 통제된 애플리케이션 개발을 확장하려는 조직에 상대적으로 잘 맞는다. 크레아티오가 가장 크게 개선해야 할 지점은 테스트, 비즈니스 로직 설계, 비용 관리다. 테스트는 프로세스 모델·규칙·수식·커스텀 코드를 가로지르는 복잡한 로직에 대한 포괄적인 네이티브 계획·회귀 자동화가 부족하다. AI 비용 통제는 세밀한 내부 <span class=\"gterm\" tabindex=\"0\">차지백<span class=\"gterm-note\">여러 부서가 공유하는 자원의 사용량만큼 비용을 각자에게 나눠 청구하는 방식</span></span>과 예측 기능이 부족하다.", "sc_html": "<div class=\"sc-section\"><p class=\"sc-heading is-strength\">강점</p><ul class=\"sc-list\"><li><strong>제품/서비스:</strong> 크레아티오는 비주얼 애플리케이션 개발과 프로세스 자동화, CRM을 하나의 아키텍처 위에 올렸다. 업무 담당자는 워크플로를 비주얼로 구성하고, 기술 팀은 API와 AI 코딩 에이전트로 이를 확장한다. 고객은 별도 제품을 통합할 필요 없이 일관된 운영 체계를 구축할 수 있다.</li><li><strong>제품 전략:</strong> 크레아티오는 애플리케이션 개발과 워크플로 자동화, 에이전트 생애주기 관리를 하나의 구독 체계 안에 정렬했다. Business Studio와 AI Studio 모듈을 무제한 라이선스 옵션으로 묶어 제공한다. 고객은 좌석 기반의 예측하기 어려운 비용 부담 없이 <span class=\"gterm\" tabindex=\"0\">로우코드<span class=\"gterm-note\">코드를 적게 짜고 화면에서 끌어다 놓는 방식으로 애플리케이션을 만드는 개발 방식</span></span> 도입을 확장할 수 있다.</li><li><strong>고객 경험:</strong> 크레아티오는 전담 고객 성공 관리와 역할별 아카데미 교육, 표준화된 자격증 프로그램을 제공한다. 이런 자원은 개발자와 업무 담당자를 함께 지원하며, 파트너 생태계가 구축 작업을 돕는다. 고객은 전문가의 안내와 교육을 결합해 플랫폼 <span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span>를 확보할 수 있다.</li></ul><p class=\"sc-heading is-caution\">주의할 점</p><ul class=\"sc-list\"><li><strong>운영:</strong> 크레아티오는 AWS와 마이크로소프트 애저 위에서 벤더 관리형 클라우드 서비스를 제공하는 동시에, 고객 관리형 클라우드와 온사이트 배포 옵션도 함께 둔다. 고객 관리형 배포에서는 애플리케이션, 데이터베이스, 캐싱 구성요소를 포함한 기반 인프라의 운영과 유지보수 책임을 고객이 진다. 이 배포 모델을 선택하는 고객은 가용성, 업그레이드, 백업, 재해 복구, 확장에 대한 책임 소재를 명확히 하고, 그 환경을 운영할 플랫폼 엔지니어링 역량을 갖췄는지 점검해야 한다.</li><li><strong>제품 전략:</strong> 크레아티오는 무료 버전이나 무료 개발자 등급을 제공하지 않아, 많은 경쟁사가 개발자와 시민 개발자의 체험·도입을 유도할 때 쓰는 무비용 진입점이 없다. 구매를 결정하기 전에 폭넓게 시범 적용하거나 현장 차원의 도입을 끌어내려는 고객은 진입 장벽이 더 높고 내부 설득도 더뎌질 수 있다.</li><li><strong>영업 실행·가격정책:</strong> 크레아티오는 플랫폼 라이선스에 표준 AI 기능을 포함하지만, AI 사용량은 AI 액션 단위로 과금한다. 사용량이 늘어날수록 사전에 소비 전제를 세워 두지 않으면 비용 예측이 어려워질 수 있다. 고객은 폭넓게 도입하기 전에 예상 운영 사용량을 모델링하고, 포함된 AI 액션과 추가 사용 요금, 확장 조건을 명확히 해야 한다.</li></ul></div>"}, {"order": 5, "name": "Oracle", "quadrant_color": "#0f766e", "quadrant_ko": "리더", "overview_html": "오라클의 제품은 Oracle APEX AI Application Generator로, Oracle AI Database에 포함돼 있으며 Oracle AI Autonomous Database와 Oracle Cloud Infrastructure(OCI)에서 제공돼 메타데이터 기반 앱을 데이터베이스 위에서 네이티브로 구동한다. 2026년 5월 출시된 Oracle APEX 26.1은 AI 에이전트와 개발자가 애플리케이션을 명확하고 구조화된 파일로 정의·생성·검증·소스 관리할 수 있게 하는 애플리케이션 정의 언어 APEXlang을 도입했다. 구성 가능한 AI 도구와 <span class=\"gterm\" tabindex=\"0\">가드레일<span class=\"gterm-note\">AI가 벗어나면 안 되는 행동 범위를 미리 정해 두는 안전장치</span></span>, SQL·애플리케이션 로직 생성을 돕는 AI 어시스턴트, 네이티브 워크플로와 함께 AI 에이전트가 도입됐다. Oracle APEX에 가장 알맞은 활용 사례는 에이전틱 프로세스 워크플로 오케스트레이션으로, 기업이 신뢰할 수 있고 통제된 데이터를 대상으로 AI 에이전트가 여러 단계의 비즈니스 프로세스를 직접 실행해야 하는 경우다. APEX는 Oracle Database 안에서 네이티브로 구동되며 로직과 메타데이터가 데이터가 있는 자리에서 실행되므로, APEX Workflow와 선언적 AI 에이전트를 미들웨어 없는 깊은 데이터베이스 통합·데이터베이스 네이티브 보안과 결합한다. 그 결과 에이전트는 통제되지 않은 자동화가 아니라 기업 통제 범위 안에서 승인된 데이터를 가져와 승인된 로직을 실행한다. Oracle APEX의 가장 강한 역량은 애플리케이션 보안, <span class=\"gterm\" tabindex=\"0\">에이전틱 워크플로<span class=\"gterm-note\">AI 에이전트가 여러 단계를 스스로 판단해 실행하는 업무 처리 흐름</span></span>, 플랫폼 지원이다. 프롬프트 완화를 통해 데이터베이스 통제를 AI 기능까지 확장하고, OCI를 통해 고가용성과 특정 시점 복구를 제공하며, 복잡한 환경 전반에서 환경 분리와 워크스페이스 격리를 단순화한다. Oracle APEX가 가장 크게 개선해야 할 지점은 테스트, 에이전트 구축·배포, 사용자 경험 설계다. AI 지원 테스트 생성은 지원하지만 독립된 네이티브 녹화·재생 테스트 스위트가 없고, 에이전트 구성은 여전히 개발자 중심이라 네이티브 평가 기능이 부족하며, 사용자 경험 설계 면에서는 배포된 애플리케이션의 네이티브 모바일·오프라인 기능을 서드파티 컴포넌트에 의존한다.", "sc_html": "<div class=\"sc-section\"><p class=\"sc-heading is-strength\">강점</p><ul class=\"sc-list\"><li><strong>제품/서비스(DevOps):</strong> 오라클 APEX는 복잡한 환경 전반에서 네이티브 환경 분리와 워크스페이스 격리를 제공한다. APEX 26.1에서 출시된 APEXlang을 쓰면 AI가 생성한 애플리케이션이 읽기 쉽고 소스 관리가 가능한 정의서 형태로 만들어져, 개발자와 AI 에이전트가 통제된 개발 워크플로 안에서 검토하고 검증할 수 있다. 이 기능은 버전 관리나 검토 체계를 희생하지 않고도 팀에 통제된 AI 지원 생성 경로를 제공한다.</li><li><strong>고객 경험:</strong> 오라클은 APEX를 성숙한 온보딩, 지원 서비스, 폭넓은 고객 생태계로 뒷받침한다. 이 플랫폼은 확립된 기업 인프라 안에서 신뢰할 수 있는 도입 경로를 보장하기 위해 깊이 있는 운영 도구를 활용한다. 고객은 <span class=\"gterm\" tabindex=\"0\">로우코드<span class=\"gterm-note\">코드를 적게 짜고 화면에서 끌어다 놓는 방식으로 애플리케이션을 만드는 개발 방식</span></span> 플랫폼을 도입할 때 매우 안정적이고 잘 지원되는 전환 과정을 누릴 수 있다.</li><li><strong>운영:</strong> APEX는 OCI와 멀티클라우드, 고객 관리형 또는 <span class=\"gterm\" tabindex=\"0\">온프레미스<span class=\"gterm-note\">클라우드가 아니라 조직이 직접 소유한 서버에 설치해 운영하는 방식</span></span> 환경 전반에서 Oracle AI Database와 매니지드 Autonomous 인프라 위에서 동작한다. 이 플랫폼은 고가용성, 자동 백업, 특정 시점 복구, 성숙한 워크스페이스 격리·관리 기능을 제공한다. 널리 보급된 Oracle AI Database 역량 기반을 활용해, IT 리더는 별도 시스템을 구축하지 않고도 기업급 복원력과 생애주기 통제를 확보할 수 있다.</li></ul><p class=\"sc-heading is-caution\">주의할 점</p><ul class=\"sc-list\"><li><strong>영업 실행·가격정책:</strong> APEX를 저비용 옵션으로 평가하는 고객은 전체 구축 비용을 모델링해야 한다. 총비용이 APEX 자체의 무과금 지위에 머무르지 않고, 기반이 되는 Oracle AI Database와 인프라 사용량에 따라 함께 늘어나기 때문이다. APEX는 Oracle AI Database의 무과금 기능이고 별도 가격이 매겨진 APEX Service도 사용자·개발자·워크로드 단위 요금을 추가하지 않지만, APEX가 의존하는 데이터베이스와 인프라는 사용량이 늘수록 여전히 비용을 끌어올린다.</li><li><strong>업종 전략:</strong> APEX는 <span class=\"gterm\" tabindex=\"0\">로우코드<span class=\"gterm-note\">코드를 적게 짜고 화면에서 끌어다 놓는 방식으로 애플리케이션을 만드는 개발 방식</span></span> 플랫폼으로서 업종별 지향점이 제한적이며, 일부 경쟁사보다 업종 특화 가속기와 템플릿, 참조 사례가 적다. 로우코드 플랫폼 안에서 미리 구축된 업종 맞춤형 역량을 찾는 고객은 직접 구축하거나, APEX 대신 오라클의 별도 패키지형 애플리케이션을 찾아야 할 수 있다.</li><li><strong>제품/서비스(테스트):</strong> APEX는 독립형 네이티브 녹화·재생 방식 테스트 자동화 도구를 제공하지 않고, 대신 셀레니엄이나 오라클의 Application Testing Suite 같은 외부 프레임워크에 의존한다. 다만 통제된 AI 지원 테스트 생성·검증 기능은 지원한다. 플랫폼에 기본 내장된 검증 기능을 원하는 고객은 AI 가속 배포를 계획할 때 필요한 통합 작업을 함께 고려해야 한다.</li></ul></div>"}, {"order": 6, "name": "ServiceNow", "quadrant_color": "#0f766e", "quadrant_ko": "리더", "overview_html": "서비스나우의 제품은 ServiceNow AI Platform으로, App Engine, AI Agent Studio, AI Control Tower, Workflow Data Fabric, Process Mining, ServiceNow Otto(옛 Now Assist)를 아우른다. App Engine은 Build Agent를 내장한 AI 기반 <span class=\"gterm\" tabindex=\"0\">로우코드<span class=\"gterm-note\">코드를 적게 짜고 화면에서 끌어다 놓는 방식으로 애플리케이션을 만드는 개발 방식</span></span> 개발을 제공하고, AI Agent Studio는 에이전트 개발을, AI Control Tower는 <span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span>를 집중화하며, Workflow Data Fabric은 에이전트와 워크플로의 데이터 연결과 근거 확보를 맡는다. ServiceNow AI Platform은 <span class=\"gterm\" tabindex=\"0\">멀티테넌트<span class=\"gterm-note\">여러 고객이 같은 시스템 인프라를 나눠 쓰되 데이터는 서로 분리되는 구조</span></span> 클라우드로 구동되며 하이브리드와 고객·파트너 운영 프라이빗 인스턴스 옵션도 있다. 서비스나우에 가장 알맞은 활용 사례는 에이전틱 프로세스 워크플로 오케스트레이션으로, 강력한 프로세스 거버넌스를 반영한다. 맞춤 정책 점검을 포함해 위험·컴플라이언스 체계에 따라 AI 자산을 분류할 수 있게 하며, 역할 마스킹, 프롬프트 인젝션 점검 지원, AI 게이트웨이를 바탕으로 에이전트·도구·사람 참여자 전반의 데이터 접근을 보호한다. 서비스나우의 가장 강한 역량은 애플리케이션·데이터 연결성, <span class=\"gterm\" tabindex=\"0\">에이전틱 워크플로<span class=\"gterm-note\">AI 에이전트가 여러 단계를 스스로 판단해 실행하는 업무 처리 흐름</span></span>, 애플리케이션 보안이다. AI Agent Studio와 <span class=\"gterm\" tabindex=\"0\">MCP<span class=\"gterm-note\">AI 에이전트가 외부 도구·데이터에 표준화된 방식으로 접근하게 하는 연결 규격(Model Context Protocol)</span></span> 서버 제어, Integration Hub를 통해 도구·커넥터·데이터 소스를 아우르는 통제된 종합 디렉터리를 제공한다. 양방향 MCP를 지원하고, 탄탄한 역할 기반 워크플로 데이터 통제를 강제하며, 포괄적인 감사 로깅과 함께 제로트러스트 상시 인증을 제공한다. 서비스나우가 가장 크게 개선해야 할 지점은 비용 관리, 에이전트 구축·배포, 에이전트 거버넌스다. 조직·팀·사용자 단위 예산 설정을 포함한 대부분의 비용 관리 기능이 아직 제공되지 않고 토큰 추적은 미리보기 단계이며, 자체 모델 반입이나 오픈 웨이트 모델, 모델 라우팅 지원도 없다. 에이전트 거버넌스 면에서는 종단 간 LLM 모니터링과 안전성 평가가 아직 로드맵 단계다.", "sc_html": "<div class=\"sc-section\"><p class=\"sc-heading is-strength\">강점</p><ul class=\"sc-list\"><li><strong>사업 역량:</strong> 서비스나우는 전년 대비 27.2% 성장과 꾸준한 수익성을 보고하며 탄탄한 재무 안정성을 보여준다. 높은 고객 유지율과, 2025년 계약 가치 기준 6억 달러를 넘어선 ServiceNow Otto 제품군의 성장은 강한 고객 준비도와 시장을 선도하는 고착도를 나타낸다. 고객은 이 벤더의 장기적 투자 의지와 제품·서비스의 지속 가능성으로부터 혜택을 누릴 수 있다.</li><li><strong>고객 경험:</strong> 서비스나우는 모든 구독 등급에서 24시간 지원을 제공하며 응답 시간은 이슈의 심각도에 따라 달라지고, 매년 두 차례의 패밀리 릴리스를 AI 개발자 도구의 월간 릴리스로 뒷받침한다. 체계적인 교육과 CreatorCon 같은 행사, ServiceNow University를 통한 종합 교육 프로그램으로 큰 개발자 커뮤니티도 키우고 있다. 고객은 전담 지원과 단순화된 플랫폼 업그레이드, 큰 개발자 커뮤니티의 혜택을 누린다.</li><li><strong>제품/서비스:</strong> ServiceNow AI Platform은 AI 증강 애플리케이션 개발과 에이전트형 프로세스 워크플로 오케스트레이션, 애플리케이션·에이전트 <span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span>와 보안 전반에 걸쳐 강력한 역량을 갖춘 종합적인 포트폴리오를 제공한다. AI 증강 <span class=\"gterm\" tabindex=\"0\">로우코드<span class=\"gterm-note\">코드를 적게 짜고 화면에서 끌어다 놓는 방식으로 애플리케이션을 만드는 개발 방식</span></span> 플랫폼을 선호하는 고객은 자신의 사용 사례와 이 플랫폼의 정렬 정도로부터 이익을 얻을 수 있다.</li></ul><p class=\"sc-heading is-caution\">주의할 점</p><ul class=\"sc-list\"><li><strong>업종 전략:</strong> 서비스나우는 특정 업종 솔루션을 제공할 때 글로벌 시스템 통합사(GSI)에 의존한다. 이 모델은 깊이 있는 업종별 맞춤화 증거를 제한적으로만 남겼다. 업종 특화 솔루션을 찾는 고객은 맞춤화를 위해 내부 개발 팀이나 GSI에 의존해야 한다.</li><li><strong>영업 전략:</strong> 서비스나우는 직접 영업 조직의 성장 폭이 제한적이라고 밝혔다. ServiceNow AI Platform 아래로 포트폴리오를 통합했지만, AI 증강 <span class=\"gterm\" tabindex=\"0\">로우코드<span class=\"gterm-note\">코드를 적게 짜고 화면에서 끌어다 놓는 방식으로 애플리케이션을 만드는 개발 방식</span></span> 기능은 여전히 고정된 보조 기능이 딸린 App Engine 브랜드 SKU로 판매한다. 이런 이중 브랜드 구조는 상업적 조건과 라이선스, 사용 권한을 둘러싼 혼란을 일으킬 수 있다. 고객은 계약을 협상하거나 구매 옵션을 평가할 때 어려움을 겪을 수 있다.</li><li><strong>혁신:</strong> 서비스나우는 제품 전략을 일반적인 시장 흐름에 맞추며, 차별화된 비전보다 점진적인 기능 업데이트를 우선시한다. 또한 평가 과정에서 자사 AI 증강 <span class=\"gterm\" tabindex=\"0\">로우코드<span class=\"gterm-note\">코드를 적게 짜고 화면에서 끌어다 놓는 방식으로 애플리케이션을 만드는 개발 방식</span></span> 제품의 연구개발 예산 공개를 거절했다. 더 뚜렷한 혁신 로드맵을 갖춘 벤더를 찾는 고객은 이 플랫폼의 장기적인 경쟁 차별성을 가늠하기 어려울 수 있다.</li></ul></div>"}, {"order": 7, "name": "Appian", "quadrant_color": "#0f766e", "quadrant_ko": "리더", "overview_html": "어피안의 제품은 Appian Platform으로, 버전 26.5를 기준으로 평가했으며 <span class=\"gterm\" tabindex=\"0\">로우코드<span class=\"gterm-note\">코드를 적게 짜고 화면에서 끌어다 놓는 방식으로 애플리케이션을 만드는 개발 방식</span></span> 애플리케이션 개발, 프로세스 오케스트레이션, 케이스 관리, <span class=\"gterm\" tabindex=\"0\">데이터 패브릭<span class=\"gterm-note\">여러 시스템에 흩어진 데이터를 하나로 묶어 접근할 수 있게 하는 데이터 통합 계층</span></span>, AI를 하나의 통제된 플랫폼으로 통합한다. 이 플랫폼은 AWS(Amazon Web Services)에 호스팅된 매니지드 <span class=\"gterm\" tabindex=\"0\">SaaS<span class=\"gterm-note\">설치 없이 인터넷으로 접속해 쓰는 구독형 소프트웨어 서비스</span></span>인 Appian Cloud로 제공되며, 자체 관리 배포는 쿠버네티스 위에서 운영할 수 있다. 최근 릴리스는 Appian AI Agents, 확장된 Composer·AI Copilot 기능, Appian Cloud의 월간 릴리스 주기를 추가했다. 어피안에 가장 알맞은 활용 사례는 AI 기반 애플리케이션 현대화로, 기존 데이터와 워크플로 로직을 유지하면서 프로세스 중심·케이스 중심 애플리케이션을 현대화하는 능력을 반영한다. Appian Designer는 인터페이스, 프로세스 모델, 규칙, 통합을 지원하고, 데이터 패브릭은 기업 데이터에 대한 통합된 접근을 제공한다. AI 에이전트는 통제된 워크플로 안에서 정보를 가져오고 레코드를 갱신할 수 있다. 어피안의 가장 강한 역량은 비즈니스 로직 설계, 사용자 경험 설계, 애플리케이션 보안이다. 비즈니스 로직 설계에서는 실행 가능한 프로세스 모델, 케이스 관리, 의사결정, 사람의 승인, 장기 실행 워크플로 상태를 결합한다. 사용자 경험 설계에서는 웹·모바일 전반에 걸쳐 반응형 인터페이스, 재사용 가능한 컴포넌트, 레코드 중심 경험을 제공한다. 애플리케이션 보안에서는 애플리케이션·레코드·워크플로 전반에 역할 기반 권한과 세밀한 데이터 접근 통제를 적용한다. 어피안이 가장 크게 개선해야 할 지점은 테스트, 에이전트 구축·배포, 비용 관리다. 테스트는 버전 관리되는 평가 데이터셋, 체계적인 <span class=\"gterm\" tabindex=\"0\">레드팀 테스트<span class=\"gterm-note\">공격자 입장에서 시스템의 약점을 일부러 찾아내는 보안 검증 방식</span></span>, 에이전트 변경 전반의 자동 회귀 게이트가 부족하다. 에이전트 구축·배포는 체계적인 평가·승격을 위한 생애주기 통제가 적고, 비용 관리는 세밀한 AI 예산 책정·예측·내부 <span class=\"gterm\" tabindex=\"0\">차지백<span class=\"gterm-note\">여러 부서가 공유하는 자원의 사용량만큼 비용을 각자에게 나눠 청구하는 방식</span></span> 기능이 부족하다.", "sc_html": "<div class=\"sc-section\"><p class=\"sc-heading is-strength\">강점</p><ul class=\"sc-list\"><li><strong>제품/서비스:</strong> 어피안은 애플리케이션 개발과 프로세스 자동화, <span class=\"gterm\" tabindex=\"0\">데이터 패브릭<span class=\"gterm-note\">여러 시스템에 흩어진 데이터를 하나로 묶어 접근할 수 있게 하는 데이터 통합 계층</span></span>을 하나의 플랫폼 안에 통합했다. 에이전트 아키텍처는 기존 사용자 권한과 세밀한 통제를 에이전트의 동작과 워크플로에 그대로 적용한다. 고객은 보안과 데이터 접근, <span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span> 체계를 일관되게 유지하면서 AI 에이전트를 포함한 애플리케이션과 워크플로를 구축할 수 있다.</li><li><strong>운영:</strong> 어피안은 최대 99.99%의 서비스수준협약(SLA) 옵션을 갖춘 매니지드 클라우드 운영을 제공하며 고가용성 구성도 지원한다. 자체 관리, 하이브리드 클라우드, <span class=\"gterm\" tabindex=\"0\">온프레미스<span class=\"gterm-note\">클라우드가 아니라 조직이 직접 소유한 서버에 설치해 운영하는 방식</span></span> 환경도 함께 지원하므로, 고객은 가용성과 규제, 데이터 주권 요건에 따라 벤더 관리형 운영과 더 강한 인프라 통제권 중에서 선택할 수 있다.</li><li><strong>사업 역량:</strong> 어피안은 2025년 클라우드 구독 매출을 19% 늘려 4억 3,740만 달러를 기록했고 GAAP 기준 영업 실적도 개선했다. 흑자 전환이라는 이 긍정적 흐름은 사업의 지속가능성과 반복 매출 구조를 뒷받침한다. 고객은 플랫폼과 클라우드 운영에 대한 안정적이고 장기적인 엔지니어링 투자를 신뢰할 수 있다.</li></ul><p class=\"sc-heading is-caution\">주의할 점</p><ul class=\"sc-list\"><li><strong>마케팅 실행:</strong> 어피안은 대외 포지셔닝을 일반적인 애플리케이션 개발보다 프로세스 자동화 쪽에 무겁게 둔다. 이런 좁은 메시지는 맞춤 개발과 에이전트 생애주기 관리 역량을 제대로 드러내지 못한다. 고객은 플랫폼의 전체 활용도를 확인하려면 데이터 모델링과 테스트를 포함한 맞춤 데모를 따로 요청해야 한다.</li><li><strong>시장 대응력:</strong> 자체 관리 배포판은 분기 단위로만 업데이트되며, 일부 고급 AI 기능은 그 배포판에서 제한되거나 아예 쓸 수 없다. 조직은 자체 관리 배포를 선택하기 전에 기능 동등성과 의존 관계를 꼼꼼히 따져야 한다.</li><li><strong>영업 실행·가격정책:</strong> 어피안은 AI 에이전트와 컴포저 같은 기능을 상위 라이선스 등급으로 묶어 두고, 그 등급 안에 정해진 AI 액션 사용량만 제공한다. 고객은 다년 계약을 맺기 전에 애플리케이션과 에이전트 전반의 실제 AI 사용량을 추정하고, 초과 사용 시 가격, 포함된 용량, 확장 전제를 명확히 확인해야 한다.</li></ul></div>"}, {"order": 8, "name": "Retool", "quadrant_color": "#3a5a9c", "quadrant_ko": "비저너리", "overview_html": "리툴의 제품은 Retool 플랫폼으로, Retool Cloud와 엔터프라이즈 플랜의 자체 호스팅 Retool을 통해 평가했다. 프런트엔드 개발용 Retool Apps, LLM 작업 실행용 Retool Agents, 오케스트레이션용 Retool Workflows, Retool Database를 하나로 통합하며 이들 제품은 리소스·아이덴티티·시크릿 서비스를 공유한다. 리툴에 가장 알맞은 활용 사례는 에이전틱 프로세스 워크플로 오케스트레이션이다. LLM 추론을 결정론적 오케스트레이션, 기업 데이터, 사용자 대상 애플리케이션과 결합한다. Retool Agents는 원격 <span class=\"gterm\" tabindex=\"0\">MCP<span class=\"gterm-note\">AI 에이전트가 외부 도구·데이터에 표준화된 방식으로 접근하게 하는 연결 규격(Model Context Protocol)</span></span> 서버를 호출하고, Retool Apps는 작업을 시작하고 중요한 행동을 검토하는 휴먼인더루프 인터페이스를 제공한다. 리툴의 가장 강한 역량은 <span class=\"gterm\" tabindex=\"0\">에이전틱 워크플로<span class=\"gterm-note\">AI 에이전트가 여러 단계를 스스로 판단해 실행하는 업무 처리 흐름</span></span>, 애플리케이션·데이터 연결성, 플랫폼 지원이다. 개방형 추론을 결정론적 경로와 통합하고, REST·GraphQL을 통해 데이터베이스와 <span class=\"gterm\" tabindex=\"0\">SaaS<span class=\"gterm-note\">설치 없이 인터넷으로 접속해 쓰는 구독형 소프트웨어 서비스</span></span>를 네이티브로 연동하며, 공유 SSO와 역할 권한, 감사 통제로 모든 리소스를 관리한다. 리툴이 가장 크게 개선해야 할 지점은 테스트, 비용 관리, 에이전트 <span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span>다. 테스트는 애플리케이션과 에이전트를 아우르는 통합된 네이티브 프레임워크가 부족하고, 비용 관리는 사용량 측정 기준이 제각각이라 통합 추적과 예측이 어려우며, 에이전트 거버넌스는 세밀한 도구 단위 승인·감사 통제는 갖췄지만 생애주기 단위 정책은 아직 상대적으로 덜 세밀하다.", "sc_html": "<div class=\"sc-section\"><p class=\"sc-heading is-strength\">강점</p><ul class=\"sc-list\"><li><strong>제품/서비스:</strong> 리툴은 여러 플랫폼 배포 옵션을 제공해, 특히 AI와 관련된 다양한 개인정보 보호·컴플라이언스 요건을 충족할 유연성을 고객에게 준다. 고객은 공용, 사설, 하이브리드 배포 옵션 중에서 선택해 데이터 프라이버시와 데이터 거주 요건을 충족할 수 있다.</li><li><strong>시장 이해도:</strong> 리툴은 AI·자동화 솔루션 안에서 코드 기반 실행 단계와 모델 추론, 전통적인 워크플로 로직을 매끄럽게 섞는 능력으로 차별화한다. 고객은 솔루션 안에서 결정론적 로직과 AI 로직 단계를 혼합해 더 강한 통제력과 신뢰성으로 AI 자동화를 확장할 수 있다.</li><li><strong>비즈니스 모델:</strong> 리툴은 AI 사용량에 대한 가격 모델을 계속 발전시키면서도, 특히 최종 사용자를 위해 라이선스 장벽을 줄이는 페르소나 기반 라이선스 방식을 유지한다. 고객은 확립된 페르소나 기반 라이선스와 AI 사용량 기반 과금을 결합한 가격 모델의 혜택을 누린다.</li></ul><p class=\"sc-heading is-caution\">주의할 점</p><ul class=\"sc-list\"><li><strong>제품/서비스(테스트):</strong> 리툴의 네이티브 테스트와 AI 평가 기능은 제한적이고 통합된 체계가 없다. 이런 AI 증강 <span class=\"gterm\" tabindex=\"0\">로우코드<span class=\"gterm-note\">코드를 적게 짜고 화면에서 끌어다 놓는 방식으로 애플리케이션을 만드는 개발 방식</span></span> 플랫폼 기능은 애플리케이션과 자동화, AI 솔루션이 토큰 효율성과 신뢰성, 정확성을 갖추도록 보장하는 데 필요한 핵심 역량이다. 고객은 자신이 만들고 유지하는 솔루션의 정확성을 보장하려면 제3자 솔루션을 직접 도입하고 비용을 부담해야 한다.</li><li><strong>마케팅 전략:</strong> 리툴은 AWS, 데이터브릭스, 스노우플레이크 같은 하이퍼스케일러·데이터 플랫폼 제휴와 시스템 통합 파트너를 중심으로 파트너 전략을 키워가고 있지만, 그 생태계는 일부 경쟁사의 파트너 생태계보다 여전히 넓지 않다. 이런 한계는 제휴를 활용해 지리적으로나 업종별로 사업을 확장하는 벤더들과 경쟁하는 리툴의 역량을 떨어뜨릴 수 있다. 고객은 내부 역량 강화에 더 많이 투자해야 할 수 있다.</li><li><strong>사업 역량:</strong> 리툴의 고객 구성은 스타트업과 중소 규모 조직 쪽에 크게 치우쳐 있다. 더 큰 기업 고객은 규모에 맞는 AI <span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span>를 전용으로 지원하는 기능을 상대적으로 적게 찾을 수 있다.</li></ul></div>"}, {"order": 9, "name": "Salesforce", "quadrant_color": "#0f766e", "quadrant_ko": "리더", "overview_html": "세일즈포스의 제품은 Headless 360, Salesforce Platform, Agentforce, Data 360, MuleSoft, Flow, 보안 서비스로 구성된다. 개발자와 코딩 에이전트가 API와 <span class=\"gterm\" tabindex=\"0\">MCP<span class=\"gterm-note\">AI 에이전트가 외부 도구·데이터에 표준화된 방식으로 접근하게 하는 연결 규격(Model Context Protocol)</span></span> 서버를 통해 데이터·로직·에이전트에 접근할 수 있게 한다. 표준 라이선스나 Flex Credits로 가격을 책정하며, 무료 진입점인 Salesforce Foundations도 포함한다. 세일즈포스에 가장 알맞은 활용 사례는 보안·<span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span>·<span class=\"gterm\" tabindex=\"0\">가드레일<span class=\"gterm-note\">AI가 벗어나면 안 되는 행동 범위를 미리 정해 두는 안전장치</span></span>로, 애플리케이션과 에이전트 전반에 아이덴티티·데이터 접근·정책·AI 통제를 적용하는 능력을 반영한다. 세일즈포스는 세밀한 플랫폼 권한을 Agentforce 거버넌스, Trust Layer와 결합해 조직이 기존 기업 보안·거버넌스 통제를 유지하면서 AI 기반 애플리케이션과 워크플로를 배포할 수 있게 한다. 세일즈포스의 가장 강한 역량은 애플리케이션 보안, 플랫폼 지원, 사용자 경험 설계다. AI 전용 보호와 함께 세밀한 애플리케이션·데이터 권한을 강제하고, 플랫폼 전반의 중앙화된 관리·거버넌스를 제공하며, Lightning·Experience Cloud·Mobile Publisher와 헤드리스 인터페이스를 통해 다채널 경험을 지원한다. 세일즈포스가 개선할 지점은 에이전트 거버넌스, <span class=\"gterm\" tabindex=\"0\">데브옵스<span class=\"gterm-note\">개발과 운영을 한 흐름으로 묶어 배포를 빠르고 안전하게 반복하는 방법론(DevOps)</span></span>, 비즈니스 로직 설계다. 완전한 벤더 간 통제는 Agentforce 자체가 아니라 인접한 Agent Fabric 제어 평면에 의존한다. 단일 데브옵스 파이프라인을 통한 에이전트 <span class=\"gterm\" tabindex=\"0\">CI/CD<span class=\"gterm-note\">코드 변경을 자동으로 검증하고 배포까지 이어 주는 지속적 통합·배포 체계</span></span>는 최근 도입된 번들 메타데이터에 의존하며, 여러 설계자에게 프로세스 로직이 분산되면 솔루션이 커질수록 소유권 관리가 복잡해질 수 있다.", "sc_html": "<div class=\"sc-section\"><p class=\"sc-heading is-strength\">강점</p><ul class=\"sc-list\"><li><strong>마케팅 전략:</strong> 세일즈포스는 다양하고 전 세계에 걸친 전략 파트너 기반을 갖췄다. 이 생태계는 구축 서비스를 제공하는 업종별 파트너는 물론, CRM 제품과 Agentforce용 AppExchange 솔루션도 포함한다. 고객은 파트너의 지식과 솔루션을 활용해 AI 솔루션 도입을 가속화할 수 있다.</li><li><strong>혁신:</strong> 세일즈포스의 Headless Experience Layer(HXL)는 Agentforce에서 호스팅되는 AI 에이전트 경험을 Slack, 음성, 왓츠앱, 마이크로소프트 팀즈 등 다양한 UI 접점에서 구현하는 일관된 방법을 제공한다. HXL이 사용자가 이미 활동하는 채널 전반에 걸쳐 경험 제공을 단순화하므로, 고객은 솔루션 개발 자체에 집중할 수 있다.</li><li><strong>고객 경험:</strong> 세일즈포스의 AppExchange 마켓플레이스와 Trailhead라는 교육 사이트는 고객이 역량을 키우거나 확장 기능을 찾을 수 있는 옵션의 질과 양 양쪽에서 이 벤더를 다른 AI 증강 <span class=\"gterm\" tabindex=\"0\">로우코드<span class=\"gterm-note\">코드를 적게 짜고 화면에서 끌어다 놓는 방식으로 애플리케이션을 만드는 개발 방식</span></span> 공급사와 구별 짓는다. 고객은 기존 콘텐츠와 솔루션을 활용해 사용자와 빌더의 도입을 확장할 수 있다.</li></ul><p class=\"sc-heading is-caution\">주의할 점</p><ul class=\"sc-list\"><li><strong>제품 전략:</strong> 대규모 멀티클라우드 기업 시나리오에 세일즈포스의 AI 증강 <span class=\"gterm\" tabindex=\"0\">로우코드<span class=\"gterm-note\">코드를 적게 짜고 화면에서 끌어다 놓는 방식으로 애플리케이션을 만드는 개발 방식</span></span> 플랫폼을 배치하려면 여전히 상당한 구축 노력과 파트너 참여가 필요할 수 있다. 세일즈포스가 Mesh 인수와 사전 구축된 에이전트 템플릿, 이식 가능한 깃 기반 빌더 스킬 같은 에이전트형 도구 투자로 초기 배포 경로를 단축하긴 했지만, 더 폭넓은 범부서 확산을 추진하는 조직은 추가적인 조율과 구축 자원을 계획해야 한다.</li><li><strong>영업 전략:</strong> 세일즈포스는 전통적으로 영업·서비스·마케팅 같은 영역의 업무 담당 구매자를 상대로 판매하는 데 강점을 보여 왔기 때문에, 고객은 기존 개발 도구와 나란히 또는 그것을 대체해 세일즈포스의 AI 증강 <span class=\"gterm\" tabindex=\"0\">로우코드<span class=\"gterm-note\">코드를 적게 짜고 화면에서 끌어다 놓는 방식으로 애플리케이션을 만드는 개발 방식</span></span> 플랫폼을 기술 팀이 받아들이도록 설득하는 데 어려움을 겪을 수 있다. 세일즈포스가 기술 구매자 영역으로 확장하면서, CRM 중심의 영업 접근 방식을 그 청중의 필요와 선호에 맞게 계속 조정해야 한다.</li><li><strong>비즈니스 모델:</strong> 세일즈포스는 다른 여러 AI 증강 <span class=\"gterm\" tabindex=\"0\">로우코드<span class=\"gterm-note\">코드를 적게 짜고 화면에서 끌어다 놓는 방식으로 애플리케이션을 만드는 개발 방식</span></span> 벤더보다 더 많은 인수합병을 진행해 왔다. 이런 인수 전략은 제품과 플랫폼, 라이선스 일관성과 관련한 위험을 키울 수 있다. 세일즈포스가 인수한 제품을 자사 포트폴리오에 계속 통합해 가는 과정에서 고객은 가격이나 제품 변경을 맞닥뜨릴 수 있다.</li></ul></div>"}, {"order": 10, "name": "Siemens (Mendix)", "quadrant_color": "#0f766e", "quadrant_ko": "리더", "overview_html": "지멘스의 제품은 Mendix 플랫폼으로, RapidMiner의 AI Studio·Graph Studio와 함께 Siemens Intelligence Center X 브랜드 아래 자리한다. Mendix는 Agent Kit을 통한 맞춤 에이전트, Mendix AI Assistance(Maia)를 통한 AI 기반 개발, AI Studio에서의 ML 모델 구축을 지원한다. 플랫폼형 서비스, 고객 관리 하이브리드, <span class=\"gterm\" tabindex=\"0\">온프레미스<span class=\"gterm-note\">클라우드가 아니라 조직이 직접 소유한 서버에 설치해 운영하는 방식</span></span>, AWS GovCloud(US), 쿠버네티스 위 에어갭 구성까지 다양한 배포 유연성을 제공한다. 지멘스에 가장 알맞은 활용 사례는 에이전틱 프로세스 워크플로 오케스트레이션이다. 워크플로 에디터와 마이크로플로·나노플로 환경을 통해 팀이 중앙 정책, 위험 등급별 자율성, 역할 기반 접근 통제, 결정론적 폴백으로 통제되는 복잡한 다중 에이전트·사람-에이전트 워크플로를 설계할 수 있게 한다. Graph Studio는 구조화·비구조화 데이터 소스 전반에 걸친 시맨틱 그래프 기반 <span class=\"gterm\" tabindex=\"0\">데이터 패브릭<span class=\"gterm-note\">여러 시스템에 흩어진 데이터를 하나로 묶어 접근할 수 있게 하는 데이터 통합 계층</span></span>으로 데이터 연결성을 강화한다. 지멘스의 가장 강한 역량은 애플리케이션·데이터 연결성, <span class=\"gterm\" tabindex=\"0\">에이전틱 워크플로<span class=\"gterm-note\">AI 에이전트가 여러 단계를 스스로 판단해 실행하는 업무 처리 흐름</span></span>, 비즈니스 로직 설계다. 폭넓은 사전 구축·커뮤니티 커넥터를 제공하고, 에이전틱 활동과 결정론적 활동이 결정론적 폴백과 함께 안전하게 공존하게 하며, BPMN 워크플로와 Microflows 자동화를 Maia의 지원과 함께 결합해 복잡한 프로세스를 처리한다. 지멘스가 가장 크게 개선해야 할 지점은 에이전트 <span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span>, 에이전트 구축·배포, 테스트다. 에이전트 정책 강제 통제가 부족하고 에이전트 생성이 플랫폼 UI로 제한된다. 네이티브 테스트가 제한적이라 Menditect나 Sigrid의 Quality and Security Management 같은 유료 서드파티 애드온에 크게 의존해야 한다.", "sc_html": "<div class=\"sc-section\"><p class=\"sc-heading is-strength\">강점</p><ul class=\"sc-list\"><li><strong>운영:</strong> Mendix는 프리미엄 클라우드 리소스 패키지에 기업급 가동시간 SLA를 약속하고 탄탄한 가동시간 기록을 유지하며, 구독 등급에 따라 우선 지원을 제공한다. FedRAMP, NIS2, SOC 2, ISO 27000 계열 표준을 포함한 폭넓은 컴플라이언스 범위도 갖췄고, 연 1회 주요 릴리스 주기와 Mx11에 대한 지속적인 지원도 뒷받침한다. 규제가 엄격한 환경에서 운영하거나 더 높은 주권성을 요구하는 고객은 Mendix의 유연한 배포·운영 역량으로부터 이익을 얻을 수 있다.</li><li><strong>제품/서비스:</strong> Mendix는 RapidMiner 제품과 통합해 에이전트형 워크플로 오케스트레이션과 애플리케이션·데이터 통합, 비즈니스 워크플로 설계에서 강력한 역량을 제공한다. 고객은 이런 역량을 활용해 복잡한 에이전트형 프로세스 개발 과제를 지원할 수 있다.</li><li><strong>사업 역량:</strong> 지멘스가 Mendix를 소유한다는 사실은 강한 조직적 안정성과 장기적 뒷받침을 제공한다. Mendix는 2025년 이후 흑자를 유지했고, 배포 유연성과 주권성 요건에 대한 집중을 바탕으로 높은 고객 유지율을 유지한다. 고객은 이 플랫폼의 장기적 지속 가능성과 지멘스가 제품·서비스에 쏟는 지속적인 의지로부터 이익을 얻을 수 있다.</li></ul><p class=\"sc-heading is-caution\">주의할 점</p><ul class=\"sc-list\"><li><strong>영업 전략:</strong> Mendix는 영업 조직을 완만하게 늘리면서도 두 자릿수 매출 성장을 전망한다. 다만 이 전략에는 시장 충격에 대비한 비상 계획이 빠져 있다. 다년 투자를 결정하는 고객은 전담 제품 추진력을 확인하기 어려울 수 있다.</li><li><strong>마케팅 실행:</strong> 지멘스는 최근 RapidMiner와 Mendix를 하나의 브랜드명으로 합쳤는데, Intelligence Center X에 대한 마케팅 계획은 아직 발전 중이다. 고객은 이 벤더의 향후 제품 방향과 서비스 전략, 자신의 목표와의 정합성을 가늠하기 어려울 수 있다.</li><li><strong>비즈니스 모델:</strong> 고객은 프리미엄 등급을 구매하더라도 자동화 테스트와 고급 보안 관리를 위해 제3자 제품을 별도로 구매해야 한다. 또한 지멘스는 AI 기능에 대한 사용량 기반 가격 모델을 계속 발전시키는 중이다. 고객은 향후 비용을 예측하고 장기 가격 구조를 평가하기 어려울 수 있다.</li></ul></div>"}, {"order": 11, "name": "Pega", "quadrant_color": "#3a5a9c", "quadrant_ko": "비저너리", "overview_html": "페가의 제품은 Pega Infinity 26과 Pega Blueprint다. Pega Infinity는 Pega Cloud나 쿠버네티스 위 고객 관리 배포로 제공된다. Pega Blueprint는 비즈니스 요구사항을 Infinity Studio용 워크플로·데이터 모델·산출물로 변환하는 별도의 무료 AI 설계 도구다. 최근 릴리스는 통제된 AI 에이전트, AgentX API, Pega Agentic Process Fabric, <span class=\"gterm\" tabindex=\"0\">MCP<span class=\"gterm-note\">AI 에이전트가 외부 도구·데이터에 표준화된 방식으로 접근하게 하는 연결 규격(Model Context Protocol)</span></span>·A2A 연결을 추가했다. 페가에 가장 알맞은 활용 사례는 에이전틱 프로세스 워크플로 오케스트레이션으로, 결정론적 프로세스·규칙·사람의 작업·AI를 결합하는 깊이를 반영한다. 케이스 생애주기 안에서 에이전트가 데이터를 가져오고 행동을 실행할 수 있어, 복잡하고 장기간·여러 시스템에 걸친 워크플로를 자동화하려는 기업에 잘 맞는다. 페가의 가장 강한 역량은 <span class=\"gterm\" tabindex=\"0\">에이전틱 워크플로<span class=\"gterm-note\">AI 에이전트가 여러 단계를 스스로 판단해 실행하는 업무 처리 흐름</span></span>, 비즈니스 로직 설계, 테스트다. 케이스 관리, 프로세스 오케스트레이션, 의사결정, AI 에이전트를 통제된 워크플로 안에서 결합하고, 복잡한 규칙·의사결정·장기 실행 프로세스 상태를 지원하며, 애플리케이션과 워크플로 변경을 검증하는 비교적 강한 테스트 기능을 제공한다. 페가가 가장 크게 개선해야 할 지점은 비용 관리, 개발 역량, 애플리케이션 보안이다. AI 소비량은 모니터링할 수 있지만 네이티브 예산·예측 통제는 제한적이다. 전문 개발은 범용 코드 우선 워크플로보다 여전히 페가 고유의 규칙·애플리케이션 모델 중심이다. 플랫폼 수준의 애플리케이션 보안은 성숙했지만 AI 전용 보안 통제는 선도 경쟁사만큼 차별화돼 있지 않다.", "sc_html": "<div class=\"sc-section\"><p class=\"sc-heading is-strength\">강점</p><ul class=\"sc-list\"><li><strong>영업 전략:</strong> 페가는 무료로 제공하는 Blueprint 도구를 영업과 파트너 역량 강화 과정에 직접 포함했다. 동반 파트너 프로그램은 공동 영업 참여도를 측정해 협업 설계를 장려한다. 고객은 이 블루프린트로 요구사항을 검증하고, 개발을 시작하기 전에 이해관계자를 정렬하며, 새 애플리케이션의 초기 구축안을 확보할 수 있다.</li><li><strong>제품/서비스:</strong> 페가는 <span class=\"gterm\" tabindex=\"0\">로우코드<span class=\"gterm-note\">코드를 적게 짜고 화면에서 끌어다 놓는 방식으로 애플리케이션을 만드는 개발 방식</span></span> 개발과 워크플로 자동화, 실시간 의사결정을 하나의 플랫폼에 결합했다. Predictable AI 접근 방식은 설계 단계에서 생성형 AI 도구를 활용하고, 런타임 에이전트는 구조화된 비즈니스 규칙에 따라 움직이도록 이끈다. 고객은 완전한 추적 가능성을 유지하면서도 규제 대상 프로세스에 AI를 안전하게 적용할 수 있다.</li><li><strong>고객 경험:</strong> 페가는 전담 성공·서비스 보증 프로그램을 통해 체계적인 고객 지원을 제공한다. 이 자원은 가치 실현과 기술 위험 관리, 온라인·강사 주도 교육을 통한 역할별 역량 강화를 아우른다. 고객은 벤더 서비스와 자기 학습을 결합해 기업 규모 구축에 필요한 역량을 쌓을 수 있다.</li></ul><p class=\"sc-heading is-caution\">주의할 점</p><ul class=\"sc-list\"><li><strong>시장 대응력:</strong> 페가는 <span class=\"gterm\" tabindex=\"0\">MCP<span class=\"gterm-note\">AI 에이전트가 외부 도구·데이터에 표준화된 방식으로 접근하게 하는 연결 규격(Model Context Protocol)</span></span>와 A2A 같은 개방 표준을 지원하고 오픈소스 SDK, 배포 도구, 데이터 과학 유틸리티를 기여한다. 다만 이런 기여는 대체로 도구와 구성요소일 뿐, 개방형 AI 모델이나 개방형 애플리케이션 런타임은 아니다. 페가와 무관한 오픈소스 애플리케이션 모델과 이식성을 중시하는 고객은, 이 플랫폼을 표준으로 채택하기 전에 페가 고유의 규칙·런타임 서비스에 대한 의존도를 평가해야 한다.</li><li><strong>영업 실행·가격정책:</strong> 페가 구축은 플랫폼 또는 Pega Cloud 라이선스에 컨설팅, 교육, 기타 서비스를 결합할 수 있어, 전체 구축 비용을 추산할 때 고려해야 할 비용 항목이 늘어난다. 고객은 플랫폼 사용 권한, 구축 서비스, 교육, 운영 확장을 아우르는 시나리오 기반 총비용 모델을 활용해야 한다.</li><li><strong>업종 전략:</strong> 페가는 2026년을 맞아 제조·운송 분야의 파트너 전문화 프로그램을 중단하는 한편, 금융 서비스·헬스케어 및 생명과학·보험·정부·통신 및 미디어 업종의 공식 전문화는 유지한다. 제조·운송 업종 고객은 계약 전에 최근 페가 구축 경험과 해당 업종 솔루션, 레퍼런스 고객을 갖춘 파트너가 있는지 확인해야 한다.</li></ul></div>"}, {"order": 12, "name": "Microsoft", "quadrant_color": "#0f766e", "quadrant_ko": "리더", "overview_html": "마이크로소프트의 Power Platform은 Power Apps, Power Automate, Power Pages, Copilot Studio, Dataverse로 구성된 클라우드 기반 <span class=\"gterm\" tabindex=\"0\">로우코드<span class=\"gterm-note\">코드를 적게 짜고 화면에서 끌어다 놓는 방식으로 애플리케이션을 만드는 개발 방식</span></span> 플랫폼이다. 이 서비스들이 함께 작동해 조직이 비즈니스 애플리케이션, AI 에이전트, 웹사이트, 프로세스 자동화 솔루션을 규모 있게 만들고 배포하고 통제할 수 있게 한다. Power Apps는 캔버스·호스팅 코드·모델 기반 애플리케이션을 지원하고, Power Pages는 외부 사이트를, Power Automate는 자동화를, Dataverse는 공유 데이터·애플리케이션 서비스를 제공한다. Copilot Studio는 근거 확보, 도구, 에이전트 플로, 테스트를 갖춘 에이전트 개발 환경을 제공한다. 커넥터가 <span class=\"gterm\" tabindex=\"0\">온프레미스<span class=\"gterm-note\">클라우드가 아니라 조직이 직접 소유한 서버에 설치해 운영하는 방식</span></span> 시스템 접근을 넓혀 주지만, 고객이 플랫폼 런타임을 자체 관리 인프라에 배포할 수는 없다. 마이크로소프트에 가장 알맞은 활용 사례는 보안·<span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span>·<span class=\"gterm\" tabindex=\"0\">가드레일<span class=\"gterm-note\">AI가 벗어나면 안 되는 행동 범위를 미리 정해 두는 안전장치</span></span>로, Power Platform 제품 전반에 걸친 중앙화된 관리, 아이덴티티 통제, 데이터 정책, 에이전트 거버넌스를 반영한다. Dataverse는 세밀한 데이터 접근 통제를 제공하고, Power Platform 관리 센터와 Copilot Studio는 애플리케이션·자동화·에이전트·커넥터·AI 소비량 전반으로 거버넌스를 확장한다. 마이크로소프트의 가장 강한 역량은 플랫폼 지원, 에이전트 구축·배포, <span class=\"gterm\" tabindex=\"0\">데브옵스<span class=\"gterm-note\">개발과 운영을 한 흐름으로 묶어 배포를 빠르고 안전하게 반복하는 방법론(DevOps)</span></span>다. Power Platform 관리 센터를 통해 관리와 거버넌스를 중앙화하고, Copilot Studio에서 로우코드 에이전트 저작과 배포를 결합하며, 솔루션·배포 파이프라인·소스 관리 통합을 통해 애플리케이션 생애주기 관리를 지원한다. 마이크로소프트가 가장 크게 개선해야 할 지점은 테스트, <span class=\"gterm\" tabindex=\"0\">에이전틱 워크플로<span class=\"gterm-note\">AI 에이전트가 여러 단계를 스스로 판단해 실행하는 업무 처리 흐름</span></span>, 애플리케이션·데이터 연결성이다. 테스트는 애플리케이션·자동화·에이전트 전반에서 덜 통합돼 있고, 에이전틱 워크플로는 서로 다른 저작·용량 모델을 가진 Copilot Studio와 Power Automate 사이의 조율이 필요하며, 연결성은 API 용량 계획과 온프레미스 게이트웨이 관리가 필요할 수 있다.", "sc_html": "<div class=\"sc-section\"><p class=\"sc-heading is-strength\">강점</p><ul class=\"sc-list\"><li><strong>제품 전략:</strong> 마이크로소프트의 Power Platform 관리 센터는 매니지드 환경 제품군 안에 다양한 <span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span> 통제 기능을 두어, 앱·에이전트의 과도한 공유, 미승인 데이터 소스 연결, AI 용량 초과 사용 같은 흔한 거버넌스 위험에 대응한다. 고객은 플랫폼 통제 기능을 활용해 거버넌스 준수 수준을 확장할 수 있다.</li><li><strong>제품/서비스(플랫폼 기반 지원):</strong> 마이크로소프트의 AI 증강 <span class=\"gterm\" tabindex=\"0\">로우코드<span class=\"gterm-note\">코드를 적게 짜고 화면에서 끌어다 놓는 방식으로 애플리케이션을 만드는 개발 방식</span></span> 플랫폼은 앱, 자동화, AI 에이전트를 위한 강력한 개발·<span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span> 기능을 갖췄다. 마이크로소프트가 각 제품을 별도로 라이선스하지만, 포트폴리오 전체는 더 복잡한 솔루션 구축을 뒷받침하는 강력한 기술적 시너지를 낸다. 고객은 제품들이 서로를 인지하고 자동화에서 에이전트를 호출할 수 있는 등의 이점을 누린다.</li><li><strong>혁신:</strong> 마이크로소프트는 앱과 자동화, AI 에이전트를 기업 시스템·API 전반의 데이터와 결합하는 다양한 통합 옵션을 계속 제공한다. 이런 옵션은 AI 에이전트와 자동화를 성공적으로 구축하는 데 필요한 맥락 데이터를 반영하도록 진화해 왔다. 고객은 트랜잭션, 지식, 맥락 관련 통합 요구 전반에 걸쳐 선택지를 얻는다.</li></ul><p class=\"sc-heading is-caution\">주의할 점</p><ul class=\"sc-list\"><li><strong>제품/서비스(에이전트 <span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span>):</strong> 에이전트 개발 중 특정 기능에 대한 접근을 제한하는 것과 같은 세밀한 <span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span>·관리 통제가 일관되지 않다. 예를 들어 Copilot Studio에서 사용자나 그룹, 환경이 어떤 하니스를 쓸 수 있는지 제한할 방법이 없다. 고객은 빠진 세밀한 통제 항목을 보완하기 위해 교육 등 다른 수단에 투자해야 한다.</li><li><strong>시장 이해도:</strong> 마이크로소프트의 Power Automate와 Copilot Studio 자동화 기능은 더 복잡하고 장시간 실행되는 자동화에 충분한 기능을 제공하지 못한다. 이 도구들은 자동화 단계 안에서 코드 기반 실행을 강하게 요구하는 작업에도 어려움을 겪는다. 고객은 더 고급의 자동화 요구에 대응하려면 애저나 Foundry 같은 코드 우선 마이크로소프트 옵션에 의존하거나, 여러 벤더를 함께 쓰는 전략을 택해야 한다.</li><li><strong>비즈니스 모델:</strong> 마이크로소프트는 Power Platform에 단일 라이선스 옵션을 제공하지 않는다. 게다가 추론은 반드시 마이크로소프트 애저를 거쳐야 하므로, 고객이 다른 플랫폼에 배포된 모델로 제품이나 솔루션을 돌려 비용을 줄이는 선택을 할 수 없다. AI 사용량을 확장하는 고객은 용량 계획과 비용 배분에서 어려움을 겪어 과다 지출로 이어질 수 있다.</li></ul></div>"}, {"order": 13, "name": "OutSystems", "quadrant_color": "#0f766e", "quadrant_ko": "리더", "overview_html": "아웃시스템즈의 제품은 OutSystems Developer Cloud(ODC)로, <span class=\"gterm\" tabindex=\"0\">SaaS<span class=\"gterm-note\">설치 없이 인터넷으로 접속해 쓰는 구독형 소프트웨어 서비스</span></span>·하이브리드·<span class=\"gterm\" tabindex=\"0\">온프레미스<span class=\"gterm-note\">클라우드가 아니라 조직이 직접 소유한 서버에 설치해 운영하는 방식</span></span> 모델로 제공되는 에버그린 플랫폼이다. ODC는 비주얼·<span class=\"gterm\" tabindex=\"0\">로우코드<span class=\"gterm-note\">코드를 적게 짜고 화면에서 끌어다 놓는 방식으로 애플리케이션을 만드는 개발 방식</span></span>·<span class=\"gterm\" tabindex=\"0\">프로코드<span class=\"gterm-note\">전통적인 방식으로 코드를 직접 작성하는 전문 개발자용 개발 방식</span></span> 개발을 하나의 통제된 애플리케이션 모델 위에 통합해, AI로 생성된 것을 포함한 비주얼 산출물과 코드 기반 산출물이 하나의 생애주기·소스 관리·<span class=\"gterm\" tabindex=\"0\">CI/CD<span class=\"gterm-note\">코드 변경을 자동으로 검증하고 배포까지 이어 주는 지속적 통합·배포 체계</span></span> 파이프라인을 공유하게 한다. 최근 릴리스는 애플리케이션·데이터·로직·테스트 산출물 전반에 걸친 AI 지원 생성과 도구 사용·<span class=\"gterm\" tabindex=\"0\">MCP<span class=\"gterm-note\">AI 에이전트가 외부 도구·데이터에 표준화된 방식으로 접근하게 하는 연결 규격(Model Context Protocol)</span></span> 연결을 지원하는 네이티브 AI 에이전트를 추가했다. 아웃시스템즈에 가장 알맞은 활용 사례는 맞춤형 애플리케이션 개발이다. 전체 생애주기 딜리버리에서의 깊이를 반영해, ODC는 IDE 통합, CLI, 소스 관리 브랜칭, 풀 리퀘스트 워크플로로 전문 개발자를 지원하는 동시에 로우코드 빌더도 제공한다. ODC는 AI 생성과 네이티브 테스트 생성·실행을 짝지어, 빨라진 산출물이 여전히 검증 가능하도록 한다. 이 덕분에 규모 있게 복잡한 애플리케이션을 만들고 유지하려는 기업에 잘 맞는다. 아웃시스템즈의 가장 강한 역량은 <span class=\"gterm\" tabindex=\"0\">데브옵스<span class=\"gterm-note\">개발과 운영을 한 흐름으로 묶어 배포를 빠르고 안전하게 반복하는 방법론(DevOps)</span></span>, 애플리케이션 보안, 사용자 경험 설계다. 승인 게이트를 갖춘 체계적인 환경 승격을 제공하고, 권한을 인지하는 통제와 프롬프트 완화로 AI를 통제하며, 통제된 디자인 시스템 위에서 오프라인 우선 데이터 처리를 갖춘 네이티브 모바일 애플리케이션을 제공한다. 아웃시스템즈가 가장 크게 개선해야 할 지점은 비용 관리, 에이전트 구축·배포, 플랫폼 지원이다. 네이티브 예산 통제는 초과를 막기보다 가시성에 초점이 맞춰져 있고, 정의된 RPO·RTO와 리전 장애 조치를 갖춘 재해 복구는 기본 플랫폼에 포함돼 있지 않아 추가 구매가 필요하다.", "sc_html": "<div class=\"sc-section\"><p class=\"sc-heading is-strength\">강점</p><ul class=\"sc-list\"><li><strong>제품/서비스(개발 역량):</strong> 아웃시스템즈는 비주얼·<span class=\"gterm\" tabindex=\"0\">로우코드<span class=\"gterm-note\">코드를 적게 짜고 화면에서 끌어다 놓는 방식으로 애플리케이션을 만드는 개발 방식</span></span>·<span class=\"gterm\" tabindex=\"0\">프로코드<span class=\"gterm-note\">전통적인 방식으로 코드를 직접 작성하는 전문 개발자용 개발 방식</span></span> 개발을 하나의 통제된 애플리케이션 모델 위에 통합해, AI가 생성한 산출물도 검토·버전 관리·보안이 가능하게 유지한다. 고객은 유지보수성이나 <span class=\"gterm\" tabindex=\"0\">거버넌스<span class=\"gterm-note\">조직이 정한 규칙과 권한 범위 안에서 시스템과 데이터를 통제하는 체계</span></span> 부채를 쌓지 않고도 AI 가속 배포를 확장할 수 있다.</li><li><strong>시장 대응력:</strong> 아웃시스템즈는 시장 변화를 좇아 실질적인 제품 업데이트를 내놓은 기록이 탄탄하다. <span class=\"gterm\" tabindex=\"0\">MCP<span class=\"gterm-note\">AI 에이전트가 외부 도구·데이터에 표준화된 방식으로 접근하게 하는 연결 규격(Model Context Protocol)</span></span> 같은 상호운용 표준을 네이티브로 지원하는 것이 이런 민첩성을 잘 보여준다. 고객은 AI의 빠른 발전 속도를 따라가는 기술 로드맵의 혜택을 누린다.</li><li><strong>제품/서비스(애플리케이션 보안):</strong> 아웃시스템즈는 AI 검색과 생성, 도구 사용 전반에 권한 인식 통제를 적용하는 동시에, 프롬프트 인젝션 완화와 사용자·서비스를 위한 기업용 신원 관리 기능을 결합한다. 고객은 AI 기능이 기존 권한을 우회하지 않고 그대로 존중한다는 확신을 얻는다.</li></ul><p class=\"sc-heading is-caution\">주의할 점</p><ul class=\"sc-list\"><li><strong>영업 전략:</strong> 아웃시스템즈는 경쟁사에 비해 차별성이 덜한 성장·시장 진출 계획을 제시한다. 고객은 다년 플랫폼 투자를 검토할 때 이 벤더의 방향성과 상업적 의지에 대한 신호를 상대적으로 적게 얻는다.</li><li><strong>고객 경험:</strong> 아웃시스템즈는 선도 경쟁사보다 교육, 고객 유지, 가치 측정 프로그램이 덜 포괄적이다. 이런 체계적 지원의 공백 때문에 조직은 온보딩을 스스로 관리해야 한다. 많은 빌더 집단에 걸쳐 도입을 확장하는 고객은 내부 역량 강화·성공 프로그램에 크게 투자하거나, 아웃시스템즈 파트너의 지원에 의존해야 한다.</li><li><strong>영업 실행·가격정책:</strong> 아웃시스템즈는 비용 한도를 넘기 전에 사용을 제한하거나 차단하는 예산 임계값 같은 지출 통제 기능이 경쟁 제품보다 약하다. 이 플랫폼은 시범 단계에서 운영 단계로 갈 때 비용이 어떻게 늘어나는지 예측할 도구도 제한적으로 제공한다. 가트너는 고객 문의에서도 사용량이 늘면서 아웃시스템즈의 가격·총비용에 대한 우려가 제기되는 것을 관찰했다. 구매를 검토하는 조직은 사용량 기반 대안과 비교할 때 총소유비용을 신중히 모델링해야 한다.</li></ul></div>"}];
const byOrder = Object.fromEntries(DATA.map(d => [String(d.order), d]));

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

const panel = document.getElementById('panel');
const panelBody = document.getElementById('panel-body');

function showDetail(id) {
  const item = byOrder[id];
  if (!item) return;
  document.querySelectorAll('#chart .pt-group').forEach(g => g.classList.toggle('is-active', g.dataset.id === id));
  const numHtml = `<span class="tech-num" style="background:${item.quadrant_color}">${item.order}</span>`;
  panelBody.innerHTML = `<h3>${numHtml}${esc(item.name)}<span class="badge" style="background:${item.quadrant_color};color:#fff">${esc(item.quadrant_ko)}</span></h3>` +
    `<p class="peek-body">${item.overview_html}</p>` + item.sc_html;
  panel.classList.add('is-open');
  panel.scrollTop = 0;
}

function closePanel() {
  panel.classList.remove('is-open');
  document.querySelectorAll('#chart .pt-group').forEach(g => g.classList.remove('is-active'));
}

document.querySelectorAll('#chart .pt-group').forEach(g => {
  g.addEventListener('click', () => showDetail(g.dataset.id));
});
document.getElementById('panel-close').addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

const dragHandle = document.getElementById('panel-drag');
let dragOffset = null;
function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }
dragHandle.addEventListener('pointerdown', e => {
  const rect = panel.getBoundingClientRect();
  panel.style.left = rect.left + 'px'; panel.style.top = rect.top + 'px';
  panel.style.right = 'auto'; panel.style.bottom = 'auto';
  dragOffset = { x: e.clientX - rect.left, y: e.clientY - rect.top };
  panel.classList.add('is-dragging');
  dragHandle.setPointerCapture(e.pointerId);
});
dragHandle.addEventListener('pointermove', e => {
  if (!dragOffset) return;
  const rect = panel.getBoundingClientRect();
  const x = clamp(e.clientX - dragOffset.x, 8, window.innerWidth - rect.width - 8);
  const y = clamp(e.clientY - dragOffset.y, 8, window.innerHeight - rect.height - 8);
  panel.style.left = x + 'px'; panel.style.top = y + 'px';
});
dragHandle.addEventListener('pointerup', () => { dragOffset = null; panel.classList.remove('is-dragging'); });

// 끌어서 옮긴 뒤 창을 모바일 폭으로 줄이면 그 인라인 위치가 하단 시트 규칙보다
// 우선해 카드가 화면 밖으로 밀려난다(하이프 사이클과 같은 패턴, 2026-10-02 실측).
const mobileLayout = window.matchMedia('(max-width: 700px)');
function releaseDragPositionIfMobile() {
  if (!mobileLayout.matches) return;
  panel.style.left = '';
  panel.style.top = '';
  panel.style.right = '';
  panel.style.bottom = '';
}
mobileLayout.addEventListener('change', releaseDragPositionIfMobile);
window.addEventListener('resize', releaseDragPositionIfMobile);

const PANEL_SCALE_BASE = 420;
function updatePanelScale() {
  const scale = clamp(panel.getBoundingClientRect().width / PANEL_SCALE_BASE, 0.75, 1.9);
  panel.style.setProperty('--panel-scale', scale.toFixed(3));
}
new ResizeObserver(updatePanelScale).observe(panel);
panel.addEventListener('mouseup', updatePanelScale);

document.addEventListener('click', e => {
  if (e.target.closest('#panel')) return;
  if (e.target.closest('.pt-group')) return;
  closePanel();
});
</script>
</body></html>
